name: GASを反映する

# 予約システムの本体（GAS）を本番へ反映する。壊れると予約が止まる。
#
# ★このワークフロー自身が信頼の境界である。
#   gas/ 配下は Contents 権限だけで書き換えられる。つまり
#   「ワークフローを書けない者でも、ワークフローが読み込む入力を書ける」。
#   よって gas/ の中身は信頼せず、反映の前に以下をこのファイル側で照合する：
#     - 押し出す対象のファイル一覧（新しいファイルが増えていたら止める）
#     - 権限設定（appsscript.json）の全文
#     - clasp の設定（.clasp.json）の全文
#   許可値は gas/ には置かない。置けば攻撃者が同時に書き換えられて検査の意味が消える。
#
# ★残るリスク（CIでは塞げない）：
#   gas/*.js の中身そのものを書き換えられれば、反映後に本番の権限で任意のコードが動く。
#   これを止められるのは人間のレビューだけなので、
#   Environment `production-gas` に承認者（オーナー）を必ず設定すること。
#   承認はスマホのGitHubアプリからでも押せる。
#
# ★push による自動反映は有効にしない。
#   有効にすると「gas/ に書ける＝本番でコードを実行できる」が無条件に成立する。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gas-deploy          # 同時に2つ走らせない（反映が混ざる）
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04    # latest にしない（実行環境が黙って変わる）
    environment: production-gas      # 本番の資格情報と承認者はここにだけ置く
    env:
      DEPLOY_ID: AKfycbxqrBd-M6rYTk-9LvKn6dcs7Sjma0CbDcYwSjt4iDuMZ00IdFTOZ0BEWIroD4erVm_WjQ
      SCRIPT_ID: 1iQyWD9ysH2zrdc6wn5j9wHUV_busRmZWOHFhigNNI9bIFuoGL9Cu3kab
      CLASP_VERSION: 3.3.0
      MIN_VERSIONS_LEFT: '12'        # 残りがこれ以下なら反映しない（戻す分も要る）
    steps:
      # SHAで固定する。タグは動かせるため、タグ指定は固定になっていない。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # .git/config に資格情報を残さない

      # ───── 反映の前に確かめる ─────

      - name: 1. 余計な仕掛けが置かれていないか
        # npm は cwd から上へ .npmrc / package.json を探す。gas/ に置かれると
        # 取得元の差し替えやインストール時スクリプトで認証情報を持ち出せる。
        # clasp 本体はリポジトリ外で入れるが、念のためここでも止める。
        run: |
          set -euo pipefail
          bad=0
          for f in gas/package.json gas/package-lock.json gas/npm-shrinkwrap.json \
                   gas/.npmrc gas/.yarnrc gas/.yarnrc.yml gas/node_modules \
                   gas/.claspignore .claspignore gas/.npmignore; do
            if [ -e "$f" ]; then echo "::error::$f があります（想定外）"; bad=1; fi
          done
          [ "$bad" = 0 ] || { echo "反映を中止します。身に覚えがなければ攻撃を疑ってください。"; exit 1; }
          echo "余計な仕掛けなし"

      - name: 2. 押し出す対象のファイルが想定どおりか
        # clasp は .js/.gs/.ts/.html/appsscript.json だけを押し出す。
        # 増えていれば知らないコードが本番で動く。減っていれば本番から関数が消える。
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs = require('fs');
          // ★許可するファイル。増減させるときはこのワークフローも直す（＝人間のレビューが入る）。
          const allowed = [
            'Allocate.js', 'BookingRules.js', 'EdgeAudit.js', 'EdgeJob.js', 'EdgeVerify.js',
            'LbBatch.js', 'LineBooking.js', 'MealAi.js', 'MemberMerge.js', 'Nudge.js', 'PushToEdge.js', 'コード.js',
            'LiffApp.html', 'appsscript.json',
          ].sort();
          const pushable = (name) => /\.(js|gs|ts|html)$/i.test(name) || name === 'appsscript.json';
          const walk = (dir, base = '') => fs.readdirSync(dir, { withFileTypes: true })
            .flatMap((e) => e.isDirectory() ? walk(`${dir}/${e.name}`, `${base}${e.name}/`) : [`${base}${e.name}`]);
          const found = walk('gas').filter(pushable).sort();
          const extra = found.filter((f) => !allowed.includes(f));
          const missing = allowed.filter((f) => !found.includes(f));
          if (extra.length)   console.error('::error::想定外のファイルがあります: ' + extra.join(', '));
          if (missing.length) console.error('::error::あるはずのファイルがありません: ' + missing.join(', '));
          if (extra.length || missing.length) process.exit(1);
          console.log(`押し出す対象OK（${found.length}ファイル）`);
          JS

      - name: 3. 構文が壊れていないか
        working-directory: gas
        run: |
          set -euo pipefail
          for f in *.js; do
            node --check "$f" || { echo "::error::$f の構文が壊れています"; exit 1; }
          done
          node -e "JSON.parse(require('fs').readFileSync('appsscript.json','utf8'))"
          echo "構文OK"

      - name: 4. 権限設定が変わっていないか
        # 許可値はこのファイルの中に置く（gas/ に置くと同時に書き換えられる）。
        # 見ていないキーを足されないよう、全文を正規化して完全一致で見る。
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs = require('fs');
          // ★2026-09-29 時点で承認済みの権限設定。変えるときはオーナーの承認を取る。
          const approved = {
            timeZone: 'Asia/Tokyo',
            exceptionLogging: 'STACKDRIVER',
            runtimeVersion: 'V8',
            webapp: { executeAs: 'USER_DEPLOYING', access: 'ANYONE_ANONYMOUS' },
            oauthScopes: [
              'https://www.googleapis.com/auth/calendar',
              'https://www.googleapis.com/auth/gmail.send',
              'https://www.googleapis.com/auth/spreadsheets',
              'https://www.googleapis.com/auth/script.external_request',
              'https://www.googleapis.com/auth/script.scriptapp',
            ],
          };
          const canon = (v) => Array.isArray(v) ? [...v].map(canon).sort()
            : (v && typeof v === 'object')
              ? Object.keys(v).sort().reduce((o, k) => (o[k] = canon(v[k]), o), {})
              : v;
          const now = JSON.parse(fs.readFileSync('gas/appsscript.json', 'utf8'));
          const a = JSON.stringify(canon(now)), b = JSON.stringify(canon(approved));
          if (a !== b) {
            console.error('::error::権限設定が承認済みの内容と違います');
            console.error('  いま  : ' + a);
            console.error('  承認済: ' + b);
            console.error('意図した変更なら、このワークフローの approved も一緒に直してください（レビューが入ります）');
            process.exit(1);
          }
          console.log('権限設定OK（変更なし）');
          JS

      - name: 5. clasp の設定が変わっていないか
        # scriptId だけ見ても足りない。rootDir を変えれば別のファイル集合が押し出される。
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs = require('fs');
          const approved = { scriptId: process.env.SCRIPT_ID, rootDir: '.' };
          const now = JSON.parse(fs.readFileSync('gas/.clasp.json', 'utf8'));
          const canon = (o) => JSON.stringify(Object.keys(o).sort().reduce((a, k) => (a[k] = o[k], a), {}));
          if (canon(now) !== canon(approved)) {
            console.error('::error::.clasp.json が承認済みの内容と違います');
            console.error('  いま  : ' + canon(now));
            console.error('  承認済: ' + canon(approved));
            process.exit(1);
          }
          console.log('clasp設定OK');
          JS

      - name: 6. clasp を入れる（リポジトリの外に・スクリプトを走らせない）
        # ★gas/ の中で npm install してはいけない。
        #   インストール時スクリプトや取得元の差し替えで認証情報を持ち出せる。
        run: |
          set -euo pipefail
          node -e 'const m=+process.versions.node.split(".")[0]; if(m<20){console.error("::error::Node "+process.versions.node+" は古すぎます");process.exit(1)} console.log("Node "+process.versions.node)'
          mkdir -p "$RUNNER_TEMP/clasptool"
          # 取得元を公式に固定し、リポジトリ側の npm 設定を読ませない。
          # ★userconfig と globalconfig に同じファイルを渡すと npm が二重読み込みを拒否するので、
          #   中身は同じでも別のファイルにする。
          printf 'registry=https://registry.npmjs.org/\naudit=false\nfund=false\nignore-scripts=true\n' \
            > "$RUNNER_TEMP/npmrc-user"
          cp "$RUNNER_TEMP/npmrc-user" "$RUNNER_TEMP/npmrc-global"
          cd "$RUNNER_TEMP"
          npm install --prefix "$RUNNER_TEMP/clasptool" \
            --userconfig "$RUNNER_TEMP/npmrc-user" \
            --globalconfig "$RUNNER_TEMP/npmrc-global" \
            --ignore-scripts --no-fund --no-audit \
            "@google/clasp@${CLASP_VERSION}"
          CLASP="$RUNNER_TEMP/clasptool/node_modules/.bin/clasp"
          test -x "$CLASP" || { echo "::error::clasp が入っていません"; exit 1; }
          got="$("$CLASP" --version)"
          case "$got" in
            *"$CLASP_VERSION"*) echo "clasp $got" ;;
            *) echo "::error::claspの版が想定と違います: $got"; exit 1 ;;
          esac

      - name: 7. 認証を置く
        env:
          CLASP_AUTH: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          set +x
          [ -n "${CLASP_AUTH:-}" ] || { echo "::error::CLASPRC_JSON が未登録です"; exit 1; }
          printf '%s' "$CLASP_AUTH" > "$RUNNER_TEMP/clasprc.json"
          chmod 600 "$RUNNER_TEMP/clasprc.json"
          node -e 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/clasprc.json", "utf8"))' \
            || { echo "::error::登録された認証情報がJSONとして壊れています"; exit 1; }
          echo "認証を置きました"

      - name: 8. 反映先・いまのバージョン・残数を確かめる
        working-directory: gas
        run: |
          set -euo pipefail
          CLASP="$RUNNER_TEMP/clasptool/node_modules/.bin/clasp --auth $RUNNER_TEMP/clasprc.json"

          # 指定したデプロイが実在するか＋いまのバージョン番号（戻すときに使う）
          $CLASP deployments --json > "$RUNNER_TEMP/deps.json"
          prev="$(node -e '
            const d = JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/deps.json", "utf8"));
            const list = Array.isArray(d) ? d : (d.deployments || []);
            const hit = list.find((x) => x.deploymentId === process.env.DEPLOY_ID);
            if (!hit) { console.error("::error::指定したデプロイが見つかりません"); process.exit(1); }
            process.stdout.write(String(hit.versionNumber || ""));
          ')"
          echo "PREV_VERSION=$prev" >> "$GITHUB_ENV"
          echo "いまの本番バージョン: @${prev:-HEAD}"

          # ★バージョン残数は「反映の前」に見る。200に達すると反映も戻しもできなくなる。
          $CLASP versions --json > "$RUNNER_TEMP/vers.json"
          node -e '
            const d = JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/vers.json", "utf8"));
            const list = Array.isArray(d) ? d : (d.versions || []);
            if (!Array.isArray(list)) { console.error("::error::バージョン一覧を読めませんでした"); process.exit(1); }
            const left = 200 - list.length;
            console.log(`バージョン ${list.length}/200（残り ${left} 本）`);
            if (left <= Number(process.env.MIN_VERSIONS_LEFT)) {
              console.error(`::error::残りが ${left} 本しかありません。GASエディタの「プロジェクト履歴」から古いものを削除してください。`);
              process.exit(1);
            }
          '

      - name: 9. 反映する
        id: push
        working-directory: gas
        run: |
          set -euo pipefail
          CLASP="$RUNNER_TEMP/clasptool/node_modules/.bin/clasp --auth $RUNNER_TEMP/clasprc.json"
          $CLASP push --force
          $CLASP update-deployment "$DEPLOY_ID" -d "auto ${GITHUB_SHA::7}" --json \
            > "$RUNNER_TEMP/newdep.json"
          new="$(node -e '
            const d = JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/newdep.json", "utf8"));
            process.stdout.write(String(d.versionNumber || ""));
          ')"
          echo "NEW_VERSION=$new" >> "$GITHUB_ENV"
          echo "反映しました（@${new:-?}）"

      - name: 10. 生きているか確かめる
        id: health
        # ★ここが「本番が動いているか」の判定。落ちたときだけ前の版へ戻す。
        run: |
          set -euo pipefail
          #   action=ping は認証の要らない既存の入口。doGet が動かなければ落ちる。
          #   ★これは「動いている」ことの証明にはならない（予約が作れるかは見ていない）。
          #     どのファイルに構文エラーがあっても全体が落ちるので、その検出が目的。
          #   -L は必須（GASは googleusercontent へ転送する）。
          url="https://script.google.com/macros/s/${DEPLOY_ID}/exec?action=ping"
          body="$RUNNER_TEMP/health.txt"
          code=000
          for i in 1 2 3 4 5; do
            code="$(curl -sS -L -o "$body" -w '%{http_code}' --max-time 30 "$url" || echo 000)"
            [ "$code" = "200" ] && break
            echo "応答 HTTP $code（${i}回目）— 反映直後は少し待つ"
            sleep 10
          done
          echo "応答: HTTP $code"
          [ "$code" = "200" ] || { echo "::error::生存確認に失敗しました（HTTP $code）"; exit 1; }
          # 200でも中身がエラーのことがある（GASは例外を200で返す）
          node -e '
            const fs = require("fs");
            const t = fs.readFileSync(process.env.RUNNER_TEMP + "/health.txt", "utf8");
            let j; try { j = JSON.parse(t); } catch (e) {
              console.error("::error::応答がJSONではありません: " + t.slice(0, 200)); process.exit(1);
            }
            if (j.ok !== true || typeof j.ts !== "number") {
              console.error("::error::応答が想定と違います: " + t.slice(0, 200)); process.exit(1);
            }
            console.log("生きています");
          '

      - name: 11. 反映が本当に切り替わったか
        # 「push は通ったがデプロイが古い版のまま」という空振りを検出する。
        #
        # ★ここでは前の版に戻さない。
        #   Google側は書いた直後の一覧に古い版を返すことがある（読み取りの遅れ）。
        #   一度きりの照合で食い違いと決めつけて戻すと、通った反映を自分で取り消してしまう
        #   （2026-09-29 に実際に起きた：@236 を反映したのに一覧が @235 を返し、巻き戻した）。
        #   何度か待っても切り替わらないなら、それは本当に反映されていないので止める。
        #   ただし本番は前の版で生きているため、戻す操作は不要。
        working-directory: gas
        run: |
          set -euo pipefail
          CLASP="$RUNNER_TEMP/clasptool/node_modules/.bin/clasp --auth $RUNNER_TEMP/clasprc.json"
          seen=""
          for i in 1 2 3 4 5 6; do
            $CLASP deployments --json > "$RUNNER_TEMP/deps2.json"
            seen="$(node -e '
              const d = JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/deps2.json", "utf8"));
              const list = Array.isArray(d) ? d : (d.deployments || []);
              const hit = list.find((x) => x.deploymentId === process.env.DEPLOY_ID);
              process.stdout.write(String((hit && hit.versionNumber) || ""));
            ')"
            if [ "$seen" = "$NEW_VERSION" ]; then
              echo "本番は @$NEW_VERSION を指しています（${i}回目）"
              exit 0
            fi
            echo "まだ @${seen:-?}（期待 @$NEW_VERSION・${i}回目）— 反映の伝わりを待つ"
            sleep 10
          done
          echo "::error::反映が切り替わりませんでした（いま @${seen:-?}／期待 @$NEW_VERSION）"
          echo "本番は前の版のまま動いています。戻す操作は不要です。"
          echo "GASエディタのデプロイ設定を確認してから、もう一度実行してください。"
          exit 1

      - name: 12. 生存確認が落ちたら前のバージョンに戻す
        # 反映は通ったが本番が動かなくなった、という一番危ない形だけを自動で戻す。
        # ★バージョンの照合が合わないだけでは戻さない（本番は前の版で生きているため）。
        if: failure() && steps.push.outcome == 'success' && steps.health.outcome == 'failure' && env.PREV_VERSION != ''
        working-directory: gas
        run: |
          set -euo pipefail
          CLASP="$RUNNER_TEMP/clasptool/node_modules/.bin/clasp --auth $RUNNER_TEMP/clasprc.json"
          echo "::warning::本番を @$PREV_VERSION に戻します"
          $CLASP update-deployment "$DEPLOY_ID" -V "$PREV_VERSION" -d "rollback to @$PREV_VERSION"
          url="https://script.google.com/macros/s/${DEPLOY_ID}/exec?action=ping"
          code=000
          for i in 1 2 3; do
            code="$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 30 "$url" || echo 000)"
            [ "$code" = "200" ] && break
            sleep 10
          done
          echo "戻したあとの応答: HTTP $code"
          [ "$code" = "200" ] || echo "::error::戻しても応答しません。GASエディタから手当てしてください。"

      - name: 13. 後片付け
        if: always()
        run: rm -f "$RUNNER_TEMP/clasprc.json" "$RUNNER_TEMP/health.txt"
