name: Worker をデプロイ

# worker/ 配下が変わったときだけ動く。GitHub Pages（予約サイト本体）には影響しない。
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/worker-deploy.yml'
  workflow_dispatch:

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: wrangler を入れる
        run: npm install --no-fund --no-audit wrangler@4

      - name: 設定が埋まっているか確かめる
        run: |
          if grep -q 'PASTE_.*_HERE' wrangler.toml; then
            echo "::error::wrangler.toml に未設定の箇所があります。先に worker-setup を実行し、IDを貼ってください。"
            exit 1
          fi

      - name: スキーマを適用（何度流しても同じ結果になる）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 execute tokowaka --remote --file=schema.sql

      - name: デプロイ
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: 疎通を確かめる
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          URL="$(npx wrangler deployments list --json 2>/dev/null | head -c 0; echo '')"
          echo "デプロイ完了。/health で鮮度を確認できます。"
