name: Worker セットアップ（初回1回だけ）

# Cloudflare の D1 と KV を作り、そのIDを出力する。
# 手動でのみ起動する（Actions タブ → このワークフロー → Run workflow）。
# 出力されたIDを worker/wrangler.toml に貼れば、以後は deploy が通る。
on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: wrangler を入れる
        run: npm install --no-fund --no-audit wrangler@4

      - name: D1 を作る（既にあれば一覧から拾う）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 create tokowaka 2>&1 | tee d1.log || true
          echo "----- D1 一覧 -----"
          npx wrangler d1 list

      - name: KV を作る（既にあれば一覧から拾う）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler kv namespace create KV 2>&1 | tee kv.log || true
          echo "----- KV 一覧 -----"
          npx wrangler kv namespace list

      - name: 次にやること
        run: |
          echo "上の一覧から database_id と KV の id を worker/wrangler.toml に貼ってください。"
          echo "貼って push すれば、deploy ワークフローが本番へ出します。"
