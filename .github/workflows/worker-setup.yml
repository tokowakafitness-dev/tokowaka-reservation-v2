name: Worker セットアップ（初回1回だけ）

# Cloudflare の D1 と KV を用意する。手動でのみ起動する。
#
# ★D1は必ず apac（アジア太平洋）に作る。場所を指定しないと実行サーバーの場所（米国）が
#   選ばれ、お客様のスマホから問い合わせるたびに太平洋を往復することになる。
# ★D1は後から場所を変えられないため、場所を間違えたものは「消して作り直す」のではなく
#   別の名前で作り直す。消す手順は、チェックの入れ忘れ・条件式・削除失敗と
#   事故の余地が多く、壊れやすいため使わない。古いものは空のまま放置してよい（無料）。
on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_NAME: tokowaka-apac
      KV_TITLE: KV
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: wrangler を入れる
        run: npm install --no-fund --no-audit wrangler@4

      - name: D1 を用意する（アジア太平洋）
        run: |
          npx wrangler d1 create "$D1_NAME" --location=apac || echo "既にあります（作成済み）"
          echo "----- 設置場所の確認 -----"
          npx wrangler d1 info "$D1_NAME" || echo "場所を取得できませんでした"

      - name: KV を用意する
        run: |
          npx wrangler kv namespace create "$KV_TITLE" || echo "既にあります（作成済み）"
          echo "----- KV 一覧 -----"
          npx wrangler kv namespace list

      - name: 確認すること
        run: |
          echo "上の「設置場所の確認」で APAC になっていれば成功です。"
          echo "IDを手で貼る必要はありません。デプロイ時に名前から自動で引きます。"
