name: Worker セットアップ（初回1回だけ）

# Cloudflare の D1 と KV を作る。手動でのみ起動する。
# ★D1は必ず apac（アジア太平洋）に作る。既定に任せると実行サーバーの場所（米国）が選ばれ、
#   お客様のスマホから問い合わせるたびに太平洋を往復することになる。
on:
  workflow_dispatch:
    inputs:
      recreate_d1:
        description: 'D1を作り直す（中身は消えます。場所を直すときだけ true）'
        type: boolean
        default: false

jobs:
  setup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: wrangler を入れる
        run: npm install --no-fund --no-audit wrangler@4

      - name: 作り直す場合は先に消す（空のときだけ実行すること）
        if: ${{ inputs.recreate_d1 }}
        run: |
          echo "既存の tokowaka を削除します（中身は失われます）"
          npx wrangler d1 delete tokowaka -y || true

      - name: D1 を作る（アジア太平洋に固定）
        run: |
          npx wrangler d1 create tokowaka --location=apac || echo "既にあります"
          echo "----- D1 一覧 -----"
          npx wrangler d1 list

      - name: KV を作る
        run: |
          npx wrangler kv namespace create KV || echo "既にあります"
          echo "----- KV 一覧 -----"
          npx wrangler kv namespace list

      - name: 確認
        run: |
          echo "D1の region が APAC になっていることを上の一覧で確認してください。"
          echo "IDを手で貼る必要はありません。デプロイ時に名前から自動で引きます。"
