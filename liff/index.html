<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>TOKOWAKA予約</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --pri:#1b2a47; --acc:#b8965a; --line:#e6ddcd; --ok:#2e7d32; --bg:#faf5eb; --navy:#1b2a47; --ink:#1a1a1a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:'Noto Sans JP',-apple-system,"Hiragino Kaku Gothic ProN",sans-serif; color:var(--ink); background:var(--bg); }
  #app { max-width:480px; margin:0 auto; min-height:100vh; }
  header { padding:15px 16px; background:var(--navy); color:#fff; border-bottom:1px solid var(--line); font-weight:600; font-size:15px; font-family:'Shippori Mincho',serif; letter-spacing:.04em; }
  .screen { padding:16px; }
  .muted { color:#888; font-size:13px; }
  .btn { display:block; width:100%; padding:14px; border:none; border-radius:10px; background:var(--pri); color:#fff; font-size:15px; font-weight:600; margin-top:12px; cursor:pointer; }
  .btn:disabled { opacity:.5; }
  .btn-outline { background:#fff; color:var(--pri); border:1px solid var(--line); }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; }
  .trainer { display:flex; align-items:center; justify-content:space-between; padding:16px; background:#fff; border:1px solid var(--line); border-radius:12px; margin-bottom:10px; cursor:pointer; }
  .trainer:active { background:#f0f0f0; }
  .code-input { width:100%; padding:14px; font-size:22px; letter-spacing:8px; text-align:center; border:1px solid var(--line); border-radius:10px; }
  .weekbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .weekbar button { border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 12px; font-size:14px; }
  table.grid { width:100%; border-collapse:collapse; table-layout:fixed; font-size:11px; }
  table.grid { background:#fff; }
  table.grid th, table.grid td { border:1px solid #dcdcdc; text-align:center; padding:0; height:26px; }
  table.grid th { background:#f5f5f5; font-weight:600; padding:3px 0; }
  table.grid td.h { background:#f5f5f5; font-weight:600; width:34px; }
  .cell-open { background:#fff; color:var(--navy); font-weight:700; font-size:13px; cursor:pointer; }
  .cell-open:active { background:#eef1f6; }
  .cell-none { background:#fff; color:#ccc; }
  .err { color:#c62828; font-size:13px; margin-top:8px; }
  .sect-h { font-family:'Shippori Mincho',serif; font-size:14px; color:var(--navy); font-weight:600; margin:18px 4px 8px; letter-spacing:.04em; }
  .hist { padding:12px 16px; }
  .hist-date { font-weight:600; font-size:14px; color:var(--ink); }
  .hlabel { display:inline-block; font-size:11px; padding:2px 8px; border-radius:3px; background:#efe9dc; color:var(--navy); }
  .home-row { display:flex; align-items:baseline; gap:12px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
  .home-row .k { font-size:13px; color:#888; min-width:5.5em; }
  .home-row .v { font-size:14px; font-weight:700; color:var(--pri); }
  .home-row .v b { color:var(--acc); font-size:20px; margin-right:1px; }
  .big { font-size:20px; font-weight:600; margin:4px 0; font-family:'Shippori Mincho',serif; color:var(--navy); letter-spacing:.03em; }
  .done-icon { font-size:48px; text-align:center; margin:12px 0; }
  [hidden] { display:none !important; }
  header { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .lang-toggle { display:inline-flex; border:1px solid rgba(255,255,255,.5); border-radius:8px; overflow:hidden; flex:none; }
  .lang-toggle span { font-family:'Noto Sans JP',sans-serif; font-size:12px; font-weight:700; letter-spacing:.06em; padding:4px 9px; cursor:pointer; }
  .lang-on { background:#fff; color:var(--navy); }
  .lang-off { background:transparent; color:rgba(255,255,255,.85); }
</style>
</head>
<body>
<div id="app">
  <header>
    <span data-i18n="header">TOKOWAKA 吉祥寺｜予約</span>
    <span id="langToggle" class="lang-toggle"><span data-lang="ja" class="lang-on">JA</span><span data-lang="en" class="lang-off">EN</span><span data-lang="zh" class="lang-off">ZH</span></span>
  </header>

  <div id="s-loading" class="screen"><p class="muted" id="loadMsg" data-i18n="booting">起動中…</p></div>

  <div id="s-register" class="screen" hidden>
    <div class="card">
      <div class="big" data-i18n="reg_title">会員登録</div>
      <p class="muted" data-i18n="reg_desc">ご契約時の情報で登録します。すべての項目をご入力ください。</p>
      <input id="regName" style="width:100%;padding:11px;margin:6px 0;box-sizing:border-box;" data-i18n-ph="reg_ph_name" placeholder="お名前（契約時のお名前）">
      <input id="regPhone" type="tel" inputmode="tel" style="width:100%;padding:11px;margin:6px 0;box-sizing:border-box;" data-i18n-ph="reg_ph_phone" placeholder="電話番号（ハイフンなし）">
      <input id="regEmail" type="email" inputmode="email" style="width:100%;padding:11px;margin:6px 0;box-sizing:border-box;" data-i18n-ph="reg_ph_email" placeholder="メールアドレス">
      <input id="regBirthday" style="width:100%;padding:11px;margin:6px 0;box-sizing:border-box;" data-i18n-ph="reg_ph_birthday" placeholder="生年月日（例：1990/01/01）">
      <textarea id="regGoal" rows="3" style="width:100%;padding:11px;margin:6px 0;box-sizing:border-box;" data-i18n-ph="reg_ph_goal" placeholder="トレーニングの目標・ご要望"></textarea>
      <div id="registerErr" class="err" hidden></div>
      <button id="registerBtn" class="btn" data-i18n="reg_submit">登録する</button>
    </div>
    <p class="muted" data-i18n="reg_note">※ご契約情報と一致しない場合は担当トレーナーへご連絡ください。</p>
  </div>

  <div id="s-home" class="screen" hidden>
    <div class="card" style="border-top:3px solid var(--acc);">
      <div class="big" id="homeName">様</div>
      <div id="homeInfo"></div>
    </div>
    <button id="homeReserve" class="btn" data-i18n="home_reserve">予約する</button>
    <button id="homeMyRes" class="btn btn-outline" data-i18n="home_myres">予約を確認する</button>
  </div>

  <div id="s-trainer" class="screen" hidden>
    <button id="toHome" class="btn btn-outline" style="margin-top:0;" data-i18n="back_home">← ホームに戻る</button>
    <p class="muted" style="margin-top:18px;" data-i18n="trainer_prompt">担当トレーナーを選んでください。</p>
    <div id="trainerList"></div>
  </div>

  <div id="s-myres" class="screen" hidden>
    <div class="big" style="margin-bottom:12px;" data-i18n="myres_title">あなたの予約</div>
    <div id="myResList"></div>
    <button id="myResBack" class="btn btn-outline" data-i18n="back">戻る</button>
  </div>

  <div id="s-week" class="screen" hidden>
    <div class="weekbar">
      <button id="prevWeek" data-i18n="week_prev">‹ 前の週</button>
      <span id="weekLabel" style="font-size:13px;font-weight:600;"></span>
      <button id="nextWeek" data-i18n="week_next">次の週 ›</button>
    </div>
    <div id="gridWrap"></div>
    <p class="muted" style="margin-top:8px;" data-i18n="week_hint">○ をタップすると予約確認へ進みます。</p>
    <button id="backToTrainer" class="btn btn-outline" data-i18n="week_reselect">トレーナーを選び直す</button>
  </div>

  <div id="s-confirm" class="screen" hidden>
    <div class="card">
      <div class="big" data-i18n="cf_title">この内容で予約しますか？</div>
      <p><span data-i18n="cf_trainer_label">担当：</span><span id="cfTrainer"></span></p>
      <p><span data-i18n="cf_datetime_label">日時：</span><span id="cfDatetime"></span></p>
    </div>
    <div id="confirmErr" class="err" hidden></div>
    <button id="confirmBtn" class="btn" data-i18n="cf_submit">予約を確定する</button>
    <button id="confirmCancel" class="btn btn-outline" data-i18n="back">戻る</button>
  </div>

  <div id="s-done" class="screen" hidden>
    <div class="done-icon">✅</div>
    <div class="card" style="text-align:center;">
      <div class="big" data-i18n="done_title">ご予約を承りました</div>
      <p id="doneDetail" class="muted"></p>
      <p class="muted" data-i18n="done_note">前日にリマインドをお送りします。キャンセルは前日17時まで無料です。</p>
    </div>
    <button id="doneClose" class="btn" data-i18n="done_close">ホームに戻る</button>
  </div>

  <div id="s-whoami" class="screen" hidden>
    <div class="card">
      <div class="big">トレーナー登録用ID</div>
      <p class="muted">以下のIDをオーナーにお送りください（予約通知の宛先設定に使います）。</p>
      <p id="whoamiId" style="font-size:13px;word-break:break-all;background:#f5f5f5;padding:12px;border-radius:8px;"></p>
    </div>
  </div>

  <div id="s-tadmin" class="screen" hidden>
    <div class="big" style="margin-bottom:4px;">担当予約の管理</div>
    <p class="muted" id="tadminName" style="margin-bottom:14px;"></p>
    <div id="tadminList"></div>
    <button id="tadminReload" class="btn btn-outline">更新</button>
  </div>

  <div id="s-error" class="screen" hidden>
    <div class="card">
      <div class="big" data-i18n="err_title">エラー</div>
      <p id="errMsg" class="muted"></p>
    </div>
  </div>
</div>

  };
  var EN_MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var LANGS = ['ja','en','zh','zh-Hant'];
  // 中国語は簡/繁を自動判定（トグルは1つのまま）。検出した変種を zhVariant に保持し、ZHタップ時に使う。
  var zhVariant = 'zh';
  function _pickLang(code){
    code = String(code || '').toLowerCase();
    if (code.indexOf('zh') === 0) return /hant|-tw|-hk|-mo|_tw|_hk|_mo|traditional/.test(code) ? 'zh-Hant' : 'zh';
    if (code.indexOf('en') === 0) return 'en';
    return 'ja';
  }
  var LANG = (function(){
    try { var s = localStorage.getItem('tkw_lang'); if (LANGS.indexOf(s) >= 0) { if (s === 'zh' || s === 'zh-Hant') zhVariant = s; return s; } } catch(e){}
    var p = _pickLang(navigator.language || navigator.userLanguage || '');
    if (p === 'zh' || p === 'zh-Hant') zhVariant = p;
    return p;
  })();
  function _langOverridden(){ try { return LANGS.indexOf(localStorage.getItem('tkw_lang')) >= 0; } catch(e){ return false; } }
  function t(key, vars){
    var d = I18N[LANG] || I18N.ja; var s = (d[key] != null) ? d[key] : (I18N.ja[key] != null ? I18N.ja[key] : key);
    if (typeof s === 'string' && vars) s = s.replace(/\{(\w+)\}/g, function(_, k){ return (vars[k] != null) ? vars[k] : ''; });
    return s;
  }
  // 曜日ラベル（配列）
  function dow(i){ var a = (I18N[LANG] || I18N.ja).dow; return a[i]; }
  // M/D（言語共通の数値表記）
  function mdLabel(dt){ return t('date_md', { m: dt.getMonth()+1, d: dt.getDate() }); }
  // 「9月1日(月) 10:00〜11:00」/ 「Sep 1 (Mon) 10:00〜11:00」
  function fullDateLabel(dt, t1, t2){
    if (LANG === 'en') return t('date_full', { mon: EN_MON[dt.getMonth()], d: dt.getDate(), dow: dow(dt.getDay()), t1: t1, t2: t2 });
    return t('date_full', { m: dt.getMonth()+1, d: dt.getDate(), dow: dow(dt.getDay()), t1: t1, t2: t2 });
  }
  // data-i18n / data-i18n-ph を持つ静的要素を現在言語で埋める
  function applyI18n(){
    document.documentElement.setAttribute('lang', LANG);
    var els = document.querySelectorAll('[data-i18n]');
    Array.prototype.forEach.call(els, function(el){ el.textContent = t(el.getAttribute('data-i18n')); });
    var phs = document.querySelectorAll('[data-i18n-ph]');
    Array.prototype.forEach.call(phs, function(el){ el.setAttribute('placeholder', t(el.getAttribute('data-i18n-ph'))); });
    var tg = document.getElementById('langToggle');
    // ZHボタンは簡体(zh)・繁体(zh-Hant)のどちらでも点灯（トグルは3つのまま）。
    if (tg) Array.prototype.forEach.call(tg.querySelectorAll('[data-lang]'), function(el){ var dl = el.getAttribute('data-lang'); var on = (dl === LANG) || (dl === 'zh' && LANG === 'zh-Hant'); el.className = on ? 'lang-on' : 'lang-off'; });
  }
  // 言語切替：保存→静的再描画→現在の動的画面を再描画→サーバへ保存（通知言語の同期）
  function setLang(l){
    if (LANGS.indexOf(l) < 0) return;
    if (l === 'zh' || l === 'zh-Hant') zhVariant = l;   // 手動で選ばれた中国語変種を記憶
    LANG = l; try { localStorage.setItem('tkw_lang', l); } catch(e){}
    applyI18n();
    if (typeof state !== 'undefined' && state._repaint) { try { state._repaint(); } catch(e){} }
    try { api({ action:'line_setLang', lang: l }); } catch(e){}   // 通知言語をサーバに保存（失敗しても致命でない）
  }

  var BUSINESS_START = 7, BUSINESS_END = 24;
  var idToken = '';
  var state = { trainerId:'', trainerName:'', weekOffset:0, slots:[], selected:null, _index:{}, changeMode:false, changeReservationId:'', excludeStartISO:'', defaultTrainerId:'', transferMode:false, proxyMode:false, proxyCustomerId:'', proxyCustomerName:'', _trainerResv:[], transferCredits:null, useTransfer:false, repeatCount:1, isPair:false, attendeeCount:1, hasNormalRoute:false, pairRemaining:0, pairPackMax:0, pairExpire:'', packKind:'normal' };
  var _seq = 0;

  var SCREENS = ['s-loading','s-register','s-home','s-trainer','s-tadmin','s-myres','s-week','s-confirm','s-done','s-whoami','s-error'];
  function show(id){
    SCREENS.forEach(function(s){ var el = document.getElementById(s); if (el) el.hidden = (s !== id); });
  }
  function showError(msg){ var el = document.getElementById('errMsg'); if (el) el.textContent = msg; show('s-error'); }
  function dbg(msg){ var el = document.getElementById('loadMsg'); if (el) el.textContent = msg; }
  function showWhoami(w){ var el = document.getElementById('whoamiId'); if (el) el.textContent = (w && w.lineUserId) ? w.lineUserId : '取得できませんでした'; show('s-whoami'); }
  function on(id, fn){ var el = document.getElementById(id); if (el) el.onclick = fn; }

  function _rawApi(params){
    params.idToken = idToken;
    return new Promise(function(resolve, reject){
      var cb = 'jcb_' + (++_seq) + '_' + new Date().getTime();
      var s = document.createElement('script');
      var timer = setTimeout(function(){ cleanup(); reject('サーバー応答がタイムアウトしました'); }, 20000);
      function cleanup(){ clearTimeout(timer); try { delete window[cb]; } catch(e){ window[cb] = undefined; } if (s.parentNode) s.parentNode.removeChild(s); }
      window[cb] = function(data){ cleanup(); resolve(data); };
      var qs = Object.keys(params).map(function(k){ return encodeURIComponent(k) + '=' + encodeURIComponent(params[k] == null ? '' : params[k]); }).join('&');
      s.src = GAS_URL + '?' + qs + '&callback=' + cb;
      s.onerror = function(){ cleanup(); reject('サーバーへの接続に失敗しました'); };
      document.head.appendChild(s);
    });
  }

  // ID Token失効(UNAUTHORIZED)を自動回復：まず getIDToken() で取り直して1回リトライ、
  // それでもダメなら1回だけリロードして liff.init を再実行（無限ループは sessionStorage で防止）。
  function api(params){
    return _rawApi(params).then(function(res){
      if (res && res.code === 'UNAUTHORIZED') {
        var fresh = (typeof liff !== 'undefined' && liff.getIDToken) ? (liff.getIDToken() || '') : '';
        if (fresh && fresh !== idToken) {
          idToken = fresh;
          return _rawApi(params);            // 新しいID Tokenで1回だけ再試行
        }
        if (!sessionStorage.getItem('_reauthTried')) {
          sessionStorage.setItem('_reauthTried', '1');
          dbg('セッションを更新しています…');
          location.reload();                 // liff.init を再実行して新ID Tokenを取得
          return new Promise(function(){});  // リロード中は解決しない
        }
      }
      return res;
    });
  }

  function boot(){
    try {
      dbg('起動 / LIFF_ID=' + (LIFF_ID ? 'あり' : 'なし'));
      if (!LIFF_ID) { showError('LIFF IDが未設定です。'); return; }
      if (!window.liff) { showError('LIFF SDKが読み込めていません（ネットワーク）。'); return; }
      dbg('LIFF初期化中…');
      liff.init({ liffId: LIFF_ID }).then(function(){
        dbg('ログイン確認中…');
        if (!liff.isLoggedIn()) { dbg('ログインへ移動…'); liff.login(); return; }
        idToken = liff.getIDToken();
        if (!idToken) { showError('IDトークンが取得できません。LIFFのScopeで openid が有効か確認してください。'); return; }
        // 言語：手動切替が無ければ LINEアプリ言語で自動判定し、検出値をサーバへ保存（通知言語の同期）。
        try {
          if (!_langOverridden()) {
            var _ll = ''; try { _ll = (liff.getAppLanguage && liff.getAppLanguage()) || (liff.getLanguage && liff.getLanguage()) || ''; } catch(e){}
            var _nl = _ll ? _pickLang(_ll) : LANG;
            if (_nl === 'zh' || _nl === 'zh-Hant') zhVariant = _nl;   // LINEアプリ言語から簡/繁を確定
            if (_nl !== LANG) { LANG = _nl; applyI18n(); }
          }
          api({ action:'line_setLang', lang: LANG });   // 登録済みなら通知言語を保存（未登録はサーバ側で無視／登録時に確定）
        } catch(e){}
        try { if (location.href.indexOf('whoami') >= 0) sessionStorage.setItem('_whoami','1'); } catch(e){}
        var _isWhoami = false; try { _isWhoami = (location.href.indexOf('whoami')>=0) || (sessionStorage.getItem('_whoami')==='1'); } catch(e){ _isWhoami = location.href.indexOf('whoami')>=0; }
        if (_isWhoami) {
          try{ sessionStorage.removeItem('_whoami'); }catch(e){}
          dbg('ID取得中…');
          // LIFF SDKから直接userId取得（バックエンド検証を通さない＝確実）
          if (liff.getProfile) { return liff.getProfile().then(function(p){ showWhoami({ lineUserId: p.userId }); }).catch(function(e){ showWhoami({}); }); }
          return api({ action:'line_whoami' }).then(showWhoami);
        }
        dbg(t('loading'));
        return api({ action:'line_getMemberStatus' });
      }).then(function(res){
        if (!res) return;
        if (res.success) { try { sessionStorage.removeItem('_reauthTried'); } catch(e){} }
        if (res.success && res.role === 'trainer') { renderTrainerAdmin(res); }
        else if (res.success && res.verified) { renderHome(res); }
        else if (res.success) { show('s-register'); }
        else { showError(t('err_member_status', { code: res.code || '?' })); }
      }).catch(function(e){ showError(t('err_init', { msg: (e && e.message ? e.message : e) })); });
    } catch (err) {
      showError('起動エラー：' + (err && err.message ? err.message : err));

      // チケット補充（枚数1〜／単価はトレーナー入力・必須／有効期限は任意＝空なら今日＋⌈枚数/2⌉ヶ月・購入パックごと独立）

      var pinp = document.createElement('input'); pinp.type = 'number'; pinp.min = '0'; pinp.inputMode = 'numeric'; pinp.placeholder = '単価(円)'; pinp.style.cssText = 'padding:9px;width:104px;';

      tbtn.textContent = 'チケット補充';
      // ペアチケット：チェックで通常単価欄を出す（1名来店の差額算定用）。qtyは回数×2の人数回でbackendが積む。
      var prow = document.createElement('div'); prow.style.cssText = 'width:100%;display:flex;gap:8px;align-items:center;';
      var pchk = document.createElement('input'); pchk.type = 'checkbox'; pchk.id = 'refillPair';

      // レンタル(0円)：チェックで単価0固定・入力不可に（レンタルは売上count×2000で別計上・チケット単価0）
      var rchk = document.createElement('input'); rchk.type = 'checkbox'; rchk.id = 'refillRental';
      var rlab = document.createElement('label'); rlab.htmlFor = 'refillRental'; rlab.textContent = 'レンタル(0円)'; rlab.className = 'muted';

      rchk.addEventListener('change', function(){ if (rchk.checked) { pinp.value = '0'; pinp.disabled = true; pchk.checked = false; pchk.disabled = true; ninp.style.display = 'none'; } else { pinp.disabled = false; pinp.value = ''; pchk.disabled = false; } });

        var expireISO = einp.value ? String(einp.value).replace(/-/g, '/') : '';
        api({ action:'line_addTicketRefill', customerId:_cId, tickets:tsel.value, unitPrice:price, expireISO:expireISO, pair:isPair, normalUnitPrice:(isPair?normalPrice:''), rental:isRental }).then(function(res){
          if (res && res.success) { window.alert((res.pair ? 'ペアチケット' : 'チケット') + res.tickets + (res.pair ? '人数回' : '回') + 'を補充しました（有効期限 ' + res.expire + '）。'); refreshCustomerHome(_cId, homeCard); }
          else { showError('補充に失敗しました（' + ((res&&res.code)||'不明') + '）。'); }
        }).catch(function(e){ showError('通信に失敗しました：'+e); });

      rw.appendChild(tsel); rw.appendChild(pinp); rw.appendChild(einp); rw.appendChild(tbtn);

  }
  // 予約の代行（トレーナーが顧客の代わりに新規予約）— まずトレーナー選択（#4：担当を選べる。鈴木が沖担当で代行等）→週グリッド

  // 残数(home)のHTML（会員ホーム・トレーナーの顧客詳細で共用）。detailed=trueで月額の「今月のご予約」明細も出す。
  function homeInfoHtml(h, detailed){
    h = h || { type:null };
    // 月額の内訳：繰越優先消化。当月消化 thisMonth をまず繰越から引き、残りを当月枠から引く。
    //   繰越残 = max(0, carryover − thisMonth)、今月残 = max(0, quota − max(0, thisMonth − carryover))。
    //   合計(繰越残＋今月残) は既存 monthlyRemaining/remaining と一致する（超過消化時のみ両者0にクランプ・ハーネスで担保）。
    function monthlyParts(){
      var q = Number(h.quota || 0), co = Number(h.carryover || 0), tm = Number(h.thisMonth || 0);
      var carryRemain = Math.max(0, co - tm);
      var monthRemain = Math.max(0, q - Math.max(0, tm - co));
      var auth = (h.monthlyRemaining !== null && h.monthlyRemaining !== undefined) ? h.monthlyRemaining
               : (h.remaining !== null && h.remaining !== undefined) ? h.remaining : null;
      var total = (auth !== null) ? auth : (carryRemain + monthRemain);
      return { carryRemain: carryRemain, monthRemain: monthRemain, total: total, hasCarry: co > 0 };
    }
    // 月額の内訳行（繰越 残n回 ／ 今月 残n回）。繰越が無い契約では繰越を出さない。
    function monthlyBreakdownRow(p){
      var parts = [];
      if (p.hasCarry) parts.push(t('bd_carry', { n: p.carryRemain }));
      parts.push(t('bd_month', { n: p.monthRemain }));
      return '<div class="home-row"><span class="k">' + t('bd_label') + '</span><span class="v" style="font-size:13px;line-height:1.6;">'
        + parts.join(' ／ ') + '</span></div>';
    }
    // チケットの pack 別内訳行（残n回（期限まで））。pack が無ければ単一期限行にフォールバック。
    function packBreakdownRow(singleExpire, isTicketType){
      var ps = h.ticketPacks || [];
      if (ps.length) return '<div class="home-row"><span class="k">' + t('ticket_breakdown') + '</span><span class="v" style="font-size:13px;line-height:1.6;">'
        + ps.map(function(p){ return p.expire ? t('bd_pack', { n: p.remaining, e: p.expire }) : t('bd_pack_noexp', { n: p.remaining }); }).join('<br>') + '</span></div>';
      return singleExpire ? '<div class="home-row"><span class="k">' + (isTicketType ? t('expiry_valid') : t('expiry_ticket')) + '</span><span class="v" style="font-size:14px;">' + singleExpire + '</span></div>' : '';
    }
    if (h.type && h.active === false) return '<p class="muted">' + t('inactive_contract') + '</p>';
    if (h.type === 'both') {
      var p = monthlyParts();
      var grand = p.total + Number(h.ticketRemaining || 0);
      return '<div class="home-row"><span class="k">' + t('home_month_left') + '</span><span class="v"><b>' + p.total + '</b> ' + t('unit_times') + '</span></div>' +
        monthlyBreakdownRow(p) +
        '<div class="home-row"><span class="k">' + t('home_ticket_left') + '</span><span class="v"><b>' + h.ticketRemaining + '</b> ' + t('unit_sheets') + '</span></div>' +
        packBreakdownRow(h.ticketExpire, false) +
        '<div class="home-row"><span class="k">' + t('bd_total') + '</span><span class="v"><b>' + grand + '</b> ' + t('unit_times') + '</span></div>';
    }
    if (h.type === 'ticket') return '<div class="home-row"><span class="k">' + t('home_ticket_left') + '</span><span class="v"><b>' + h.remaining + '</b> ' + t('unit_times') + '</span></div>' +
      packBreakdownRow(h.expire, true);
    if (h.type === 'monthly') {
      var mp = monthlyParts();
      var s = '<div class="home-row"><span class="k">' + t('home_month_left') + '</span><span class="v"><b>' + mp.total + '</b> ' + t('unit_times') + '</span></div>';
      s += monthlyBreakdownRow(mp);
      if (detailed) { var carry = h.carryover ? t('plus_carry', { c: h.carryover }) : '';
        s += '<div class="home-row"><span class="k">' + t('this_month_bookings') + '</span><span class="v" style="font-size:14px;">' + t('month_detail', { used: h.thisMonth, quota: t('month_quota', { q: h.quota }), carry: carry }) + '</span></div>'; }
      return s;
    }
    return detailed ? '<p class="muted" style="margin-top:12px;">' + t('book_here') + '</p>' : '<p class="muted">' + t('no_balance') + '</p>';
  }

        '<div class="home-row" style="display:block;line-height:1.7;">'

  // 予約/キャンセル完了後にアプリを閉じず、残数を再取得してホームへ戻す（連続予約対応）。
  function loadHome(){
    state.transferMode = false; state.changeMode = false; state.changeReservationId = '';

  function loadMyReservations(){

            + '<p class="muted" style="font-size:12px;margin-top:4px;">' + note + '</p>';
          if (r.freeCancel) {   // 前日17時まで＝無料で時間変更可。当日はキャンセル→振替に統一。
            var chg = document.createElement('button');
            chg.className = 'btn btn-outline';
            chg.style.marginTop = '8px';
            chg.textContent = t('change_time');

          }

          btn.className = 'btn btn-outline';

          btn.textContent = t('cancel_this');
          btn.onclick = function(){ cancelReservation(r); };
          d.appendChild(btn);
          box.appendChild(d);
        });
      }
      // ── これまでの記録（実施済み・当日キャンセル消化）──
      if (res.history && res.history.length) {

        res.history.forEach(function(r){
          var hd = document.createElement('div'); hd.className = 'card hist';
          hd.innerHTML = '<div class="hist-date">' + r.dateLabel + '</div><p class="muted" style="margin-top:4px;">' + t('trainer_colon') + r.trainerName + '　<span class="hlabel">' + r.statusLabel + '</span></p>';
          box.appendChild(hd);

  function startChange(r){
    var note = r.freeCancel ? '' : t('confirm_change_penalty');
    if (!window.confirm(t('confirm_change', { date: r.dateLabel, note: note }))) return;
    state.changeMode = true;
    state.changeReservationId = r.reservationId;
    state.excludeStartISO = r.startISO || '';   // 自分の旧予定を空き枠から除外（問題2）
    state.trainerId = r.trainerId;
    state.trainerName = r.trainerName;
    state.weekOffset = 0;
    loadSlots();                 // 同トレーナーの週グリッドへ（新しい時間を選ぶ）
  }

  function cancelReservation(r){
    var msg;
    if (r.freeCancel) {
      msg = t('confirm_cancel_free', { date: r.dateLabel });
    } else if (r.transfer) {
      // 振替セッションの当日キャンセルは、確認の時点で「再申込不可」を明示する。
      msg = t('confirm_cancel_transfer', { date: r.dateLabel });
    } else {
      msg = t('confirm_cancel_penalty', { date: r.dateLabel });
    }
    if (!window.confirm(msg)) return;
    show('s-loading'); dbg(t('loading'));
    api({ action:'line_cancelReservation', reservationId: r.reservationId }).then(function(res){
      if (!res || !res.success) { showError(t('err_cancel', { code: (res && res.code) || '?' })); return; }
      if (res.penalty && !r.transfer) {
        // 当日キャンセル＝1回消化。振替セッション（+5,500円）を案内。
        // ★振替セッション自身のキャンセルでは案内しない（振替の振替＝再振替を防ぐ。バックエンドでも同ガード）。
        if (window.confirm(t('confirm_transfer_offer'))) {
          startTransfer(r);
          return;
        }
      }
      loadMyReservations();
    }).catch(function(e){ showError(t('comm_fail', { msg: e })); });
  }

  function startTransfer(r){
    state.transferMode = true;
    state.changeMode = false; state.changeReservationId = '';
    state.excludeStartISO = r.startISO || '';   // キャンセルした元予定を振替枠の空き判定から除外（問題2）
    state.trainerId = r.trainerId;
    state.trainerName = r.trainerName;
    state.weekOffset = 0;
    loadSlots();                 // 同トレーナーの週グリッドで振替枠を選ぶ（残数は消化せず5,500円）
  }

  function loadSlots(){
    show('s-loading'); dbg(t('loading'));
    api({ action:'line_getTrainerSlots', trainerId: state.trainerId, excludeStartISO: state.excludeStartISO || '' }).then(function(res){
      if (!res.success) { showError(t('err_slots')); return; }
      state.slots = res.slots || [];
      renderWeek();
      state._repaint = renderWeek;   // 言語切替で週グリッドを再描画（キャッシュ済みslotsを使用）
      show('s-week');
    }).catch(function(e){ showError(t('comm_fail',{msg:e})); });
  }

  function fmtDate(d){
    var y=d.getFullYear(), m=('0'+(d.getMonth()+1)).slice(-2), day=('0'+d.getDate()).slice(-2);
    return y+'/'+m+'/'+day;
  }

  function renderWeek(){
    var base = new Date(); base.setHours(0,0,0,0);
    base.setDate(base.getDate() + state.weekOffset*7);
    var days = [];
    for (var i=0;i<7;i++){ var d=new Date(base); d.setDate(base.getDate()+i); days.push(d); }
    document.getElementById('weekLabel').textContent =
      mdLabel(days[0]) + ' 〜 ' + mdLabel(days[6]);

    var index = {};
    state.slots.forEach(function(s){
      var h = parseInt((s.startTime||'0:0').split(':')[0], 10);
      var key = s.date + '#' + h;
      (index[key] = index[key] || []).push(s);   // 同じ時間帯に複数枠（15分刻み）を保持
    });
    Object.keys(index).forEach(function(k){ index[k].sort(function(a,b){ return a.startISO < b.startISO ? -1 : 1; }); });

    var html = '<table class="grid"><thead><tr><th></th>';
    days.forEach(function(d){ html += '<th>'+ (d.getMonth()+1)+'/'+d.getDate()+'<br>'+dow(d.getDay()) +'</th>'; });
    html += '</tr></thead><tbody>';
    for (var h=BUSINESS_START; h<BUSINESS_END; h++){
      html += '<tr><td class="h">'+h+'</td>';
      days.forEach(function(d){
        var key = fmtDate(d) + '#' + h;
        html += index[key] ? '<td class="cell-open" data-key="'+key+'">○</td>' : '<td class="cell-none">·</td>';
      });
      html += '</tr>';
    }
    html += '</tbody></table>';
    var wrap = document.getElementById('gridWrap'); wrap.innerHTML = html;
    state._index = index;
    Array.prototype.forEach.call(wrap.querySelectorAll('.cell-open'), function(td){
      td.onclick = function(){
        var slots = state._index[td.getAttribute('data-key')];
        if (!slots || !slots.length) return;
        if (slots.length === 1) { openConfirm(slots[0]); return; }   // 毎時（9月〜）＝1枠→即確認
        chooseStartTime(slots);   // 15分刻み（8月）＝複数枠→開始時刻を選ばせる
      };
    });
  }

  on('prevWeek', function(){ if(state.weekOffset>0){ state.weekOffset--; renderWeek(); } });
  on('nextWeek', function(){
    var _n=new Date(); _n.setHours(0,0,0,0);
    var _horizon=new Date(_n.getFullYear(), _n.getMonth()+2, 0);   // 来月末（9月→10/31・10月→11/30…）
    var _max=Math.floor((_horizon.getTime()-_n.getTime())/(7*86400000));   // 来月末を含む週まで週送り可
    if(state.weekOffset < Math.max(3, _max)){ state.weekOffset++; renderWeek(); }
  });
  on('backToTrainer', function(){ state.changeMode=false; state.changeReservationId=''; state.transferMode=false; state.proxyMode=false; if (state._fromTrainerAdmin){ state._fromTrainerAdmin=false; loadTrainerReservations(); return; } show('s-trainer'); });

  // 15分刻みの日：同じ時間帯に複数の開始時刻がある→選ばせる
  function chooseStartTime(slots){
    var old = document.getElementById('startPicker'); if (old) old.remove();
    var wrap = document.getElementById('gridWrap');
    var box = document.createElement('div'); box.id = 'startPicker';
    box.style.cssText = 'margin:12px 0;padding:12px;background:#fff;border:1px solid var(--acc);border-radius:8px;';
    box.innerHTML = '<div style="margin-bottom:8px;font-weight:600;">' + t('choose_start') + '</div>';
    slots.forEach(function(s){
      var b = document.createElement('button'); b.className = 'btn btn-outline';
      b.style.cssText = 'margin:4px;display:inline-block;width:auto;padding:8px 14px;';
      b.textContent = s.startTime + '〜' + s.endTime;
      b.onclick = function(){ box.remove(); openConfirm(s); };
      box.appendChild(b);
    });
    wrap.parentNode.insertBefore(box, wrap);
    if (box.scrollIntoView) box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function openConfirm(slot){
    state.selected = slot;
    state.useTransfer = false; state.repeatCount = 1;
    // 消化先の既定：通常経路（月額・通常チケット）が残っていればそちら。ペアチケットしか無い会員だけペア既定。
    //   ※ホームの残数は「本日基準」。既定値のまま送るとサーバの対象日判定を上書きして
    //     「本日は通常が残っているが予約日には失効」等で不要に予約不能になるため、
    //     会員が明示的に選んだときだけ packKind を送る（packKindExplicit）。
    state.packKind = 'normal';
    state.packKindExplicit = false;
    // 選択肢は「予約対象日時」基準でサーバから取り直す（ホームの当日基準の残数で未来予約を縛らない）。
    //   応答が返るまで選択UIは出さず、最後のリクエストの応答だけを採用する（顧客/日時の切替競合を防ぐ）。
    state.optReady = false; state.optError = ''; state.pairRemaining = 0; state.pairPackMax = 0; state.hasNormalRoute = true;
    setConfirmEnabled();   // 取得できるまで確定させない（既定1名のまま送られるのを防ぐ）
    var _seq = (state._optSeq = (state._optSeq || 0) + 1);
    var _optReq = { action:'line_getBookingOptions', startISO: slot.startISO };
    if (state.proxyMode) _optReq.customerId = state.proxyCustomerId;
    api(_optReq).then(function(r){
      if (_seq !== state._optSeq) return;   // 古い応答は捨てる
      if (r && r.success) {
        state.pairRemaining = Number(r.pairRemaining || 0);
        state.pairPackMax = Number(r.pairPackMax || 0);
        state.hasNormalRoute = !!r.hasNormalRoute;
        state.pairExpire = String(r.pairExpire || '');   // 対象日に有効なpackの期限（当日基準の期限を出さない）
        state.isPair = state.pairRemaining > 0;
        state.packKind = (state.isPair && !state.hasNormalRoute) ? 'pair' : 'normal';
        state.attendeeCount = (!state.proxyMode && state.packKind === 'pair' && state.pairPackMax >= 2) ? 2 : 1;
        state.optReady = true; state.optError = '';
      } else {
        // 取得できないまま人数を推測して予約しない（fail-closed）
        state.optError = (r && r.message) || t('opt_fail');
      }
      buildConfirmOptions(); setConfirmEnabled();
    }).catch(function(){
      if (_seq !== state._optSeq) return;
      state.optError = t('comm_fail',{msg:''}); buildConfirmOptions(); setConfirmEnabled();
    });
    // 代行は既定1名（月額会員の通常予約が大半なので、2名はトレーナーの明示選択に限る）
    state.attendeeCount = state.proxyMode ? 1 : ((state.packKind === 'pair' && state.pairPackMax >= 2) ? 2 : 1);   // 毎回リセット
    document.getElementById('cfTrainer').textContent = state.trainerName;
    var dt = new Date(slot.startISO);
    state._repaint = function(){ openConfirm(slot); };   // 言語切替で確認画面を再描画
    document.getElementById('cfDatetime').textContent = fullDateLabel(dt, slot.startTime, slot.endTime);
    buildConfirmOptions();
    document.getElementById('confirmErr').hidden = true;
    show('s-confirm');
  }
  // 選択肢が対象日基準で確定するまで／確定できなかった場合は「予約を確定する」を押させない
  function setConfirmEnabled(){
    var b = document.getElementById('confirmBtn'); if (!b) return;
    b.disabled = !(state.optReady && !state.optError);
  }
  // #9 振替券の選択・#6 繰り返し を確定画面に動的描画（通常の会員予約フローのみ）
  function buildConfirmOptions(){
    var host = document.getElementById('cfOptions');
    if (!host) { host = document.createElement('div'); host.id='cfOptions'; host.style.cssText='margin-top:10px;'; var dtEl=document.getElementById('cfDatetime'); dtEl.parentNode.appendChild(host); }
    host.innerHTML='';
    // 選択肢の取得中/失敗時は何も描かない（当日基準の古い値や既定値で予約させない）
    if (state.optError) {
      host.innerHTML = '<div class="err">' + state.optError + '</div>';
      var rb = document.createElement('button'); rb.className='btn btn-outline'; rb.textContent=t('retry');
      rb.onclick = function(){ openConfirm(state.selected); };
      host.appendChild(rb); return;
    }
    if (!state.optReady) { host.innerHTML = '<span class="muted">' + t('cf_checking') + '</span>'; return; }
    // 代行：ペアチケットを持つ顧客は来店人数を必ず指定させる（1名固定で作ると2名来店が過少計上になる）。
    //   消化先(packKind)は送らずサーバの対象日判定に委ねる＝2名なら自動でペア、1名は通常経路優先。
    if (state.proxyMode && state.pairRemaining > 0){
      var px=document.createElement('div'); px.style.cssText='margin-bottom:8px;padding:8px 10px;background:#f0f4fa;border-radius:8px;';
      var _pcan2 = state.pairPackMax >= 2;
      px.innerHTML='<div style="font-weight:600;margin-bottom:4px;">'+t('cf_attendee_pair_hdr')+'</div>'
        +'<label style="display:inline-block;margin-right:14px;"><input type="radio" name="cfAtt" value="1"'+(state.attendeeCount===2?'':' checked')+'> '+t('att_1')+'</label>'
        +(_pcan2 ? '<label style="display:inline-block;"><input type="radio" name="cfAtt" value="2"'+(state.attendeeCount===2?' checked':'')+'> '+t('att_2_pair')+'</label>' : '<span class="muted" style="font-size:12px;">'+t('att_only1_short')+'</span>');
      px.addEventListener('change', function(){ var c=document.querySelector('input[name=cfAtt]:checked'); state.attendeeCount = (c && c.value==='2') ? 2 : 1; });
      host.appendChild(px);
    }
    var isPlain = !state.proxyMode && !state.changeMode && !state.transferMode;
    if (!isPlain) return;
    // ペアチケットと通常経路（月額/通常チケット）を両方持つ会員は、どちらを使うか選ぶ。
    //   選ばせないと常に通常が先に減り、ペアチケットが期限切れになりうるため。
    if (state.isPair && state.hasNormalRoute){
      var pk=document.createElement('div'); pk.style.cssText='margin-bottom:8px;padding:8px 10px;background:#f0f4fa;border-radius:8px;';
      var _pkExp = state.pairExpire ? t('until_wrap',{e:state.pairExpire}) : '';
      pk.innerHTML='<div style="font-weight:600;margin-bottom:4px;">'+t('cf_which_ticket')+'</div>'
        +'<label style="display:block;margin:3px 0;"><input type="radio" name="cfKind" value="normal"'+(state.packKind==='pair'?'':' checked')+'> '+t('ticket_normal')+'</label>'
        +'<label style="display:block;margin:3px 0;"><input type="radio" name="cfKind" value="pair"'+(state.packKind==='pair'?' checked':'')+'> '+t('ticket_pair')+' <span class="muted" style="font-size:12px;">'+t('pair_remaining',{n:state.pairRemaining})+_pkExp+'</span></label>';
      pk.addEventListener('change', function(){
        var c=document.querySelector('input[name=cfKind]:checked');
        state.packKind = (c && c.value==='pair') ? 'pair' : 'normal';
        state.packKindExplicit = true;   // 会員が選んだ＝サーバの自動判定より優先させる
        state.attendeeCount = (state.packKind==='pair' && state.pairPackMax>=2) ? 2 : 1;
        buildConfirmOptions();   // 人数選択・繰り返しの出し分けを作り直す
      });
      host.appendChild(pk);
    }
    // ペアチケットを使うときだけ来店人数（2名＝2消化／1名＝1消化＋差額）を選ぶ
    if (state.packKind === 'pair'){
      var pr=document.createElement('div'); pr.style.cssText='margin-bottom:8px;padding:8px 10px;background:#f0f4fa;border-radius:8px;';
      var _can2 = state.pairPackMax >= 2;   // 同一チケットに2人数回の空きが必要（1回ずつ別チケットには分割しない）
      pr.innerHTML='<div style="font-weight:600;margin-bottom:4px;">'+t('cf_attendee')+'</div>'
        +(_can2 ? '<label style="display:inline-block;margin-right:14px;"><input type="radio" name="cfAtt" value="2"'+(state.attendeeCount===2?' checked':'')+'> '+t('att_2')+'</label>' : '')
        +'<label style="display:inline-block;"><input type="radio" name="cfAtt" value="1"'+(state.attendeeCount===2?'':' checked')+'> '+t('att_1_diff')+'</label>'
        +(_can2 ? '' : '<div class="muted" style="font-size:12px;margin-top:4px;">'+t('att_only1')+'</div>');
      pr.addEventListener('change', function(){ var c=document.querySelector('input[name=cfAtt]:checked'); state.attendeeCount = (c && c.value==='2') ? 2 : 1; });
      host.appendChild(pr);
    }
    // #9：有効な振替券があるときだけ ①通常/②振替 を選べる（既定=通常）
    if (state.transferCredits && state.transferCredits.available > 0){
      var tc=document.createElement('div'); tc.style.cssText='margin-bottom:8px;padding:8px 10px;background:#faf7f0;border-radius:8px;';
      var _tcE = state.transferCredits.nextExpireLabel ? t('until_wrap',{e:state.transferCredits.nextExpireLabel}) : '';
      tc.innerHTML='<div style="font-weight:600;margin-bottom:4px;">'+t('cf_payment')+'</div>'
        +'<label style="display:block;margin:3px 0;"><input type="radio" name="cfPay" value="normal" checked> '+t('pay_normal')+'</label>'
        +'<label style="display:block;margin:3px 0;"><input type="radio" name="cfPay" value="transfer"> '+t('pay_transfer')+'<span class="muted" style="font-size:12px;"> '+t('transfer_avail')+' '+state.transferCredits.available+' '+t('unit_times')+_tcE+'</span></label>';
      tc.addEventListener('change', function(){ var c=document.querySelector('input[name=cfPay]:checked'); state.useTransfer = !!(c && c.value==='transfer'); var rs=document.getElementById('cfRepeatWrap'); if (rs) rs.style.display = state.useTransfer ? 'none' : 'flex'; if (state.useTransfer) state.repeatCount=1; });
      host.appendChild(tc);
    }
    // #6：繰り返し（振替選択時は非表示・ペアチケット利用時は人数を回ごとに選ぶ必要があるため非表示。残数不足の回は自動スキップ）
    if (state.packKind === 'pair') return;
    var rc=document.createElement('div'); rc.id='cfRepeatWrap'; rc.style.cssText='display:flex;gap:8px;align-items:center;';
    var lbl=document.createElement('span'); lbl.textContent=t('repeat_label'); lbl.className='muted';
    var sel=document.createElement('select'); sel.style.cssText='padding:8px;';
    sel.innerHTML='<option value="1">'+t('repeat_none')+'</option>'+[2,3,4,5,6,7,8].map(function(n){return '<option value="'+n+'">'+t('repeat_weekly',{n:n})+'</option>';}).join('');
    sel.addEventListener('change', function(){ state.repeatCount=Number(sel.value)||1; });
    rc.appendChild(lbl); rc.appendChild(sel); host.appendChild(rc);
  }
  on('confirmCancel', function(){ show('s-week'); });
  on('confirmBtn', function(){
    if (!state.optReady || state.optError) return;   // 二重防御：選択肢が確定していない状態では送らない
    var btn = this; var errEl = document.getElementById('confirmErr'); errEl.hidden=true;
    btn.disabled = true; btn.textContent=t('cf_submitting');
    var _isTransfer = state.transferMode || state.useTransfer;   // #9：既存の振替フロー or 確定画面で②振替を選択
    var _isRecurring = !state.proxyMode && !state.changeMode && !_isTransfer && Number(state.repeatCount) > 1;   // #6
    var req = state.proxyMode
      // 代行は来店人数のみ送り、消化先(packKind)はサーバの対象日判定に委ねる（2名なら自動でペア）
      ? { action:'line_makeReservationLineProxy', customerId: state.proxyCustomerId, trainerId: state.trainerId, startISO: state.selected.startISO, attendeeCount: state.attendeeCount }
      : _isTransfer
        ? { action:'line_makeTransferReservation', trainerId: state.trainerId, startISO: state.selected.startISO }
        : state.changeMode
          ? { action:'line_changeReservation', reservationId: state.changeReservationId, newStartISO: state.selected.startISO }
          : _isRecurring
            ? { action:'line_makeRecurringReservation', trainerId: state.trainerId, startISO: state.selected.startISO, repeatCount: state.repeatCount }
            // packKind は会員が明示的に選んだときだけ送る（未選択なら対象日基準のサーバ自動判定に任せる）
            : { action:'line_makeReservationLine', trainerId: state.trainerId, startISO: state.selected.startISO, attendeeCount: state.attendeeCount, packKind: (state.packKindExplicit ? state.packKind : '') };
    api(req)
      .then(function(res){
        btn.disabled=false; btn.textContent=t('cf_submit');
        if (res.success) {
          var s = state.selected;
          if (_isRecurring) {   // #6：作成件数・スキップ件数を表示
            document.getElementById('doneDetail').textContent = t('done_recurring', { trainer: state.trainerName, date: s.date, time: s.startTime, created: res.createdCount }) + (res.skippedCount ? t('done_recurring_skip', { skipped: res.skippedCount }) : '');
          } else {
            var tag = _isTransfer ? t('done_tag_transfer') : state.changeMode ? t('done_tag_change') : state.proxyMode ? t('done_tag_proxy') : '';
            document.getElementById('doneDetail').textContent = (state.proxyMode ? state.proxyCustomerName + t('done_cust_sep') : '') + state.trainerName + t('done_sep') + s.date + ' ' + s.startTime + '〜' + s.endTime + tag;
          }
          state.changeMode = false; state.changeReservationId = ''; state.transferMode = false; state.proxyMode = false; state.proxyCustomerId = ''; state.proxyCustomerName = ''; state.useTransfer = false; state.repeatCount = 1;
          state._repaint = null;   // 完了画面は静的（data-i18n）で再描画不要
          show('s-done');
        } else {
          errEl.textContent = res.message || t('book_fail');
          errEl.hidden = false;
        }
      }).catch(function(e){ btn.disabled=false; btn.textContent=t('cf_submit'); errEl.textContent=t('comm_fail',{msg:e}); errEl.hidden=false; });
  });

  on('doneClose', function(){ if (state._fromTrainerAdmin){ state._fromTrainerAdmin=false; loadTrainerReservations(); return; } loadHome(); });   // アプリを閉じず残数更新してホームへ（連続予約対応）

  // 言語トグルの配線＋初期の静的描画（DOMは末尾scriptの時点で構築済み）
  (function(){
    applyI18n();
    var tg = document.getElementById('langToggle');
    // ZHボタンは検出済みの中国語変種（簡=zh／繁=zh-Hant）を選ぶ。手動の簡繁切替は設けない（自動判定）。
    if (tg) Array.prototype.forEach.call(tg.querySelectorAll('[data-lang]'), function(el){ el.onclick = function(){ var dl = el.getAttribute('data-lang'); setLang(dl === 'zh' ? zhVariant : dl); }; });
  })();

  boot();
</script>
</body>
</html>
