<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>TOKOWAKA予約</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --pri:#1b2a47; --acc:#b8965a; --line:#e6ddcd; --ok:#2e7d32; --bg:#faf5eb; --navy:#1b2a47; --ink:#1a1a1a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:'Noto Sans JP',-apple-system,"Hiragino Kaku Gothic ProN",sans-serif; color:var(--ink); background:var(--bg); }
  #app { max-width:480px; margin:0 auto; min-height:100vh; }
  header { padding:15px 16px; background:var(--navy); color:#fff; border-bottom:1px solid var(--line); font-weight:600; font-size:15px; font-family:'Shippori Mincho',serif; letter-spacing:.04em; }
  .screen { padding:16px; }
  .muted { color:#888; font-size:13px; }
  .btn { display:block; width:100%; padding:14px; border:none; border-radius:10px; background:var(--pri); color:#fff; font-size:15px; font-weight:600; margin-top:12px; cursor:pointer; }
  .btn:disabled { opacity:.5; }
  .btn-outline { background:#fff; color:var(--pri); border:1px solid var(--line); }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; }
  .trainer { display:flex; align-items:center; justify-content:space-between; padding:16px; background:#fff; border:1px solid var(--line); border-radius:12px; margin-bottom:10px; cursor:pointer; }
  .trainer:active { background:#f0f0f0; }
  .code-input { width:100%; padding:14px; font-size:22px; letter-spacing:8px; text-align:center; border:1px solid var(--line); border-radius:10px; }
  .weekbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .weekbar button { border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 12px; font-size:14px; }
  table.grid { width:100%; border-collapse:collapse; table-layout:fixed; font-size:11px; }
  table.grid { background:#fff; }
  table.grid th, table.grid td { border:1px solid #dcdcdc; text-align:center; padding:0; height:26px; }
  table.grid th { background:#f5f5f5; font-weight:600; padding:3px 0; }
  table.grid td.h { background:#f5f5f5; font-weight:600; width:34px; }
  .cell-open { background:#fff; color:var(--navy); font-weight:700; font-size:13px; cursor:pointer; }
  .cell-open:active { background:#eef1f6; }
  .cell-none { background:#fff; color:#ccc; }
  .err { color:#c62828; font-size:13px; margin-top:8px; }
  .sect-h { font-family:'Shippori Mincho',serif; font-size:14px; color:var(--navy); font-weight:600; margin:18px 4px 8px; letter-spacing:.04em; }
  .hist { padding:12px 16px; }
  .hist-date { font-weight:600; font-size:14px; color:var(--ink); }
  .hlabel { display:inline-block; font-size:11px; padding:2px 8px; border-radius:3px; background:#efe9dc; color:var(--navy); }
  .home-row { display:flex; align-items:baseline; gap:12px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
  .home-row .k { font-size:13px; color:#888; min-width:5.5em; }
  .home-row .v { font-size:14px; font-weight:700; color:var(--pri); }
  .home-row .v b { color:var(--acc); font-size:20px; margin-right:1px; }
  .big { font-size:20px; font-weight:600; margin:4px 0; font-family:'Shippori Mincho',serif; color:var(--navy); letter-spacing:.03em; }
  .done-icon { font-size:48px; text-align:center; margin:12px 0; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div id="app">
  <header>TOKOWAKA 吉祥寺｜予約</header>

  <div id="s-loading" class="screen"><p class="muted" id="loadMsg">起動中…</p></div>

  <div id="s-register" class="screen" hidden>
    <div class="card">
      <div class="big">会員登録</div>
      <p class="muted">ご契約時の情報で登録します。すべての項目をご入力ください。</p>
      <input id="regName" style="width:100%;padding:11px;margin:6px 0;box-sizing:border-box;" placeholder="お名前（契約時のお名前）">
      <input id="regPhone" type="tel" inputmode="tel" style="width:100%;padding:11px;margin:6px 0;box-sizing:border-box;" placeholder="電話番号（ハイフンなし）">
      <input id="regEmail" type="email" inputmode="email" style="width:100%;padding:11px;margin:6px 0;box-sizing:border-box;" placeholder="メールアドレス">
      <input id="regBirthday" style="width:100%;padding:11px;margin:6px 0;box-sizing:border-box;" placeholder="生年月日（例：1990/01/01）">
      <textarea id="regGoal" rows="3" style="width:100%;padding:11px;margin:6px 0;box-sizing:border-box;" placeholder="トレーニングの目標・ご要望"></textarea>
      <div id="registerErr" class="err" hidden></div>
      <button id="registerBtn" class="btn">登録する</button>
    </div>
    <p class="muted">※ご契約情報と一致しない場合は担当トレーナーへご連絡ください。</p>
  </div>

  <div id="s-home" class="screen" hidden>
    <div class="card" style="border-top:3px solid var(--acc);">
      <div class="big" id="homeName">様</div>
      <div id="homeInfo"></div>
    </div>
    <button id="homeReserve" class="btn">予約する</button>
    <button id="homeMyRes" class="btn btn-outline">予約を確認する</button>
  </div>

  <div id="s-trainer" class="screen" hidden>
    <button id="toHome" class="btn btn-outline" style="margin-top:0;">← ホームに戻る</button>
    <p class="muted" style="margin-top:18px;">担当トレーナーを選んでください。</p>
    <div id="trainerList"></div>
  </div>

  <div id="s-myres" class="screen" hidden>
    <div class="big" style="margin-bottom:12px;">あなたの予約</div>
    <div id="myResList"></div>
    <button id="myResBack" class="btn btn-outline">戻る</button>
  </div>

  <div id="s-week" class="screen" hidden>
    <div class="weekbar">
      <button id="prevWeek">‹ 前の週</button>
      <span id="weekLabel" style="font-size:13px;font-weight:600;"></span>
      <button id="nextWeek">次の週 ›</button>
    </div>
    <div id="gridWrap"></div>
    <p class="muted" style="margin-top:8px;">○ をタップすると予約確認へ進みます。</p>
    <button id="backToTrainer" class="btn btn-outline">トレーナーを選び直す</button>
  </div>

  <div id="s-confirm" class="screen" hidden>
    <div class="card">
      <div class="big">この内容で予約しますか？</div>
      <p>担当：<span id="cfTrainer"></span></p>
      <p>日時：<span id="cfDatetime"></span></p>
    </div>
    <div id="confirmErr" class="err" hidden></div>
    <button id="confirmBtn" class="btn">予約を確定する</button>
    <button id="confirmCancel" class="btn btn-outline">戻る</button>
  </div>

  <div id="s-done" class="screen" hidden>
    <div class="done-icon">✅</div>
    <div class="card" style="text-align:center;">
      <div class="big">ご予約を承りました</div>
      <p id="doneDetail" class="muted"></p>
      <p class="muted">前日にリマインドをお送りします。キャンセルは前日17時まで無料です。</p>
    </div>
    <button id="doneClose" class="btn">ホームに戻る</button>
  </div>

  <div id="s-whoami" class="screen" hidden>
    <div class="card">
      <div class="big">トレーナー登録用ID</div>
      <p class="muted">以下のIDをオーナーにお送りください（予約通知の宛先設定に使います）。</p>
      <p id="whoamiId" style="font-size:13px;word-break:break-all;background:#f5f5f5;padding:12px;border-radius:8px;"></p>
    </div>
  </div>

  <div id="s-tadmin" class="screen" hidden>
    <div class="big" style="margin-bottom:4px;">担当予約の管理</div>
    <p class="muted" id="tadminName" style="margin-bottom:14px;"></p>
    <div id="tadminList"></div>
    <button id="tadminReload" class="btn btn-outline">更新</button>
  </div>

  <div id="s-error" class="screen" hidden>
    <div class="card">
      <div class="big">エラー</div>
      <p id="errMsg" class="muted"></p>
    </div>
  </div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  var LIFF_ID = '2010827953-QgBQFzh9';
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbxqrBd-M6rYTk-9LvKn6dcs7Sjma0CbDcYwSjt4iDuMZ00IdFTOZ0BEWIroD4erVm_WjQ/exec';

  var BUSINESS_START = 7, BUSINESS_END = 24;
  var idToken = '';
  var state = { trainerId:'', trainerName:'', weekOffset:0, slots:[], selected:null, _index:{}, changeMode:false, changeReservationId:'', excludeStartISO:'', defaultTrainerId:'', transferMode:false, proxyMode:false, proxyCustomerId:'', proxyCustomerName:'', _trainerResv:[], transferCredits:null, useTransfer:false, repeatCount:1, isPair:false, attendeeCount:1, hasNormalRoute:false, pairRemaining:0, pairPackMax:0, pairExpire:'', packKind:'normal' };
  var _seq = 0;

  var SCREENS = ['s-loading','s-register','s-home','s-trainer','s-tadmin','s-myres','s-week','s-confirm','s-done','s-whoami','s-error'];
  function show(id){
    SCREENS.forEach(function(s){ var el = document.getElementById(s); if (el) el.hidden = (s !== id); });
  }
  function showError(msg){ var el = document.getElementById('errMsg'); if (el) el.textContent = msg; show('s-error'); }
  function dbg(msg){ var el = document.getElementById('loadMsg'); if (el) el.textContent = msg; }
  function showWhoami(w){ var el = document.getElementById('whoamiId'); if (el) el.textContent = (w && w.lineUserId) ? w.lineUserId : '取得できませんでした'; show('s-whoami'); }
  function on(id, fn){ var el = document.getElementById(id); if (el) el.onclick = fn; }

  function _rawApi(params){
    params.idToken = idToken;
    return new Promise(function(resolve, reject){
      var cb = 'jcb_' + (++_seq) + '_' + new Date().getTime();
      var s = document.createElement('script');
      var timer = setTimeout(function(){ cleanup(); reject('サーバー応答がタイムアウトしました'); }, 20000);
      function cleanup(){ clearTimeout(timer); try { delete window[cb]; } catch(e){ window[cb] = undefined; } if (s.parentNode) s.parentNode.removeChild(s); }
      window[cb] = function(data){ cleanup(); resolve(data); };
      var qs = Object.keys(params).map(function(k){ return encodeURIComponent(k) + '=' + encodeURIComponent(params[k] == null ? '' : params[k]); }).join('&');
      s.src = GAS_URL + '?' + qs + '&callback=' + cb;
      s.onerror = function(){ cleanup(); reject('サーバーへの接続に失敗しました'); };
      document.head.appendChild(s);
    });
  }

  // ID Token失効(UNAUTHORIZED)を自動回復：まず getIDToken() で取り直して1回リトライ、
  // それでもダメなら1回だけリロードして liff.init を再実行（無限ループは sessionStorage で防止）。
  function api(params){
    return _rawApi(params).then(function(res){
      if (res && res.code === 'UNAUTHORIZED') {
        var fresh = (typeof liff !== 'undefined' && liff.getIDToken) ? (liff.getIDToken() || '') : '';
        if (fresh && fresh !== idToken) {
          idToken = fresh;
          return _rawApi(params);            // 新しいID Tokenで1回だけ再試行
        }
        if (!sessionStorage.getItem('_reauthTried')) {
          sessionStorage.setItem('_reauthTried', '1');
          dbg('セッションを更新しています…');
          location.reload();                 // liff.init を再実行して新ID Tokenを取得
          return new Promise(function(){});  // リロード中は解決しない
        }
      }
      return res;
    });
  }

  function boot(){
    try {
      dbg('起動 / LIFF_ID=' + (LIFF_ID ? 'あり' : 'なし'));
      if (!LIFF_ID) { showError('LIFF IDが未設定です。'); return; }
      if (!window.liff) { showError('LIFF SDKが読み込めていません（ネットワーク）。'); return; }
      dbg('LIFF初期化中…');
      liff.init({ liffId: LIFF_ID }).then(function(){
        dbg('ログイン確認中…');
        if (!liff.isLoggedIn()) { dbg('ログインへ移動…'); liff.login(); return; }
        idToken = liff.getIDToken();
        if (!idToken) { showError('IDトークンが取得できません。LIFFのScopeで openid が有効か確認してください。'); return; }
        try { if (location.href.indexOf('whoami') >= 0) sessionStorage.setItem('_whoami','1'); } catch(e){}
        var _isWhoami = false; try { _isWhoami = (location.href.indexOf('whoami')>=0) || (sessionStorage.getItem('_whoami')==='1'); } catch(e){ _isWhoami = location.href.indexOf('whoami')>=0; }
        if (_isWhoami) {
          try{ sessionStorage.removeItem('_whoami'); }catch(e){}
          dbg('ID取得中…');
          // LIFF SDKから直接userId取得（バックエンド検証を通さない＝確実）
          if (liff.getProfile) { return liff.getProfile().then(function(p){ showWhoami({ lineUserId: p.userId }); }).catch(function(e){ showWhoami({}); }); }
          return api({ action:'line_whoami' }).then(showWhoami);
        }
        dbg('会員状態を照会中…');
        return api({ action:'line_getMemberStatus' });
      }).then(function(res){
        if (!res) return;
        if (res.success) { try { sessionStorage.removeItem('_reauthTried'); } catch(e){} }
        if (res.success && res.role === 'trainer') { renderTrainerAdmin(res); }
        else if (res.success && res.verified) { renderHome(res); }
        else if (res.success) { show('s-register'); }
        else { showError('会員状態の取得に失敗しました（コード：' + (res.code || '不明') + '）。'); }
      }).catch(function(e){ showError('初期化に失敗しました：' + (e && e.message ? e.message : e)); });
    } catch (err) {
      showError('起動エラー：' + (err && err.message ? err.message : err));
    }
  }

  on('registerBtn', function(){
    var name = document.getElementById('regName').value.trim();
    var phone = document.getElementById('regPhone').value.trim();
    var email = document.getElementById('regEmail').value.trim();
    var birthday = document.getElementById('regBirthday').value.trim();
    var goal = document.getElementById('regGoal').value.trim();
    var errEl = document.getElementById('registerErr'); errEl.hidden = true;
    if (!name || !phone || !email || !birthday || !goal) { errEl.textContent='すべての項目をご入力ください。'; errEl.hidden=false; return; }
    var btn = this; btn.disabled = true; btn.textContent='登録中…';
    api({ action:'line_selfRegister', name:name, phone:phone, email:email, birthday:birthday, goal:goal }).then(function(res){
      btn.disabled=false; btn.textContent='登録する';
      if (res.success && res.verified) { api({ action:'line_getMemberStatus' }).then(function(r){ if (r && r.success && r.verified) renderHome(r); else show('s-home'); }); }
      else { errEl.textContent = res.message || 'ご登録できませんでした。担当トレーナーへご連絡ください。'; errEl.hidden=false; }
    }).catch(function(e){ btn.disabled=false; btn.textContent='登録する'; errEl.textContent='通信に失敗しました：'+e; errEl.hidden=false; });
  });

  function loadTrainers(){
    show('s-loading'); dbg('トレーナー取得中…');
    api({ action:'line_getTrainers' }).then(function(res){
      if (!res.success) { showError('トレーナー情報の取得に失敗しました。'); return; }
      var box = document.getElementById('trainerList'); box.innerHTML = '';
      var trainers = res.trainers.slice();
      var defId = state.defaultTrainerId || '';
      if (defId) trainers.sort(function(a,b){ return (b.id===defId?1:0) - (a.id===defId?1:0); });   // 担当を先頭に
      trainers.forEach(function(t){
        var d = document.createElement('div');
        d.className = 'trainer';
        var isDefault = (defId && t.id === defId);
        d.innerHTML = '<span>'+ t.name + (isDefault ? ' <span style="font-size:12px;color:#c8a25a;">担当</span>' : '') +'</span><span style="color:#c8a25a;">選ぶ ›</span>';
        d.onclick = function(){ state.trainerId=t.id; state.trainerName=t.name; state.weekOffset=0; state.changeMode=false; state.transferMode=false; state.excludeStartISO=''; loadSlots(); };
        box.appendChild(d);
      });
      show('s-trainer');
    }).catch(function(e){ showError('通信に失敗しました：'+e); });
  }

  on('toHome', function(){ show('s-home'); });
  on('homeReserve', function(){ loadTrainers(); });
  on('homeMyRes', function(){ loadMyReservations(); });
  on('myResBack', function(){ show('s-home'); });

  // ===== トレーナー管理ページ（Google直接編集の代替・状態乖離の防止） =====
  function renderTrainerAdmin(res){
    state.trainerId = res.trainerId || '';
    state.trainerName = res.trainerName || '';
    document.getElementById('tadminName').textContent = (res.trainerName || 'トレーナー') + ' 様｜担当の今後のご予約';
    loadTrainerReservations();
  }
  function loadTrainerReservations(){
    show('s-loading'); dbg('担当予約を取得中…');
    api({ action:'line_getTrainerReservations' }).then(function(res){
      if (!res || !res.success) { showError('担当予約の取得に失敗しました（' + ((res&&res.code)||'不明') + '）。'); return; }
      state._trainerResv = res.reservations || [];
      state._trainerCustomers = res.customers || [];   // 担当顧客（予約の有無に関係なく）
      renderCustomerList();
    }).catch(function(e){ showError('通信に失敗しました：'+e); });
  }
  // 顧客名リスト（変更・取消の代行は顧客単位で発生するため、まず顧客を選ぶ）
  function renderCustomerList(){
    var box = document.getElementById('tadminList'); box.innerHTML = '';
    document.getElementById('tadminName').textContent = (state.trainerName||'トレーナー') + ' 様｜顧客を選んで予約を変更・取消';
    var resv = state._trainerResv || [], custs = state._trainerCustomers || [];
    // 予約件数を customerId で集計
    var cntById = {}; resv.forEach(function(r){ cntById[r.customerId] = (cntById[r.customerId]||0)+1; });
    // 担当顧客（予約0でも表示）＋予約はあるが担当リスト外の顧客も統合（取りこぼし防止）
    var list = [], seen = {};
    custs.forEach(function(c){ if (c.customerId && !seen[c.customerId]) { seen[c.customerId]=true; list.push({ customerId:c.customerId, name:c.name, count: cntById[c.customerId]||0 }); } });
    resv.forEach(function(r){ if (r.customerId && !seen[r.customerId]) { seen[r.customerId]=true; list.push({ customerId:r.customerId, name:r.customerName, count: cntById[r.customerId]||0 }); } });
    if (!list.length) {
      box.innerHTML = '<p class="muted">担当のお客様がまだ登録されていません。</p>';
    } else {
      list.forEach(function(c){
        var d = document.createElement('div'); d.className = 'card'; d.style.cursor = 'pointer';
        d.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;"><b>' + c.name + ' 様</b><span class="muted">' + (c.count ? c.count+'件 ›' : '予約なし ›') + '</span></div>';
        d.onclick = function(){ renderCustomerDetail(c.customerId, c.name); };
        box.appendChild(d);
      });
    }
    var unlink = document.createElement('button'); unlink.className = 'btn btn-outline'; unlink.textContent = '未紐付け予約を紐付ける';
    unlink.onclick = function(){ loadUnlinked(); };
    box.appendChild(unlink);
    show('s-tadmin');
  }
  // 未紐付け予約（同期でカレンダーから拾ったが会員未特定）を会員に紐付ける
  function loadUnlinked(){
    show('s-loading'); dbg('未紐付け予約を取得中…');
    api({ action:'line_getUnlinked' }).then(function(res){
      if (!res || !res.success) { showError('未紐付けの取得に失敗しました（' + ((res&&res.code)||'不明') + '）。'); return; }
      state._members = res.members || [];
      renderUnlinked(res.unlinked || []);
    }).catch(function(e){ showError('通信に失敗しました：'+e); });
  }
  function renderUnlinked(list){
    var box = document.getElementById('tadminList'); box.innerHTML = '';
    document.getElementById('tadminName').textContent = '未紐付け予約の紐付け';
    var back = document.createElement('button'); back.className='btn btn-outline'; back.style.marginTop='0'; back.textContent='← 戻る';
    back.onclick = function(){ renderCustomerList(); };
    box.appendChild(back);
    if (!list.length) { var p=document.createElement('p'); p.className='muted'; p.textContent='未紐付けの予約はありません。'; box.appendChild(p); show('s-tadmin'); return; }
    var members = state._members || [];
    list.forEach(function(u){
      var d = document.createElement('div'); d.className='card';
      d.innerHTML = '<div><b>' + u.dateLabel + '</b>（' + u.kind + '）</div><div class="muted">カレンダー名：' + u.customerName + '／担当：' + u.trainerName + '</div>';
      var sel = document.createElement('select'); sel.style.cssText='width:100%;padding:9px;margin:8px 0;box-sizing:border-box;';
      sel.innerHTML = '<option value="">会員を選択…</option>' + members.map(function(m){ return '<option value="'+m.customerId+'">'+m.name+'</option>'; }).join('');
      var b = document.createElement('button'); b.className='btn'; b.style.margin='0'; b.textContent='この会員に紐付け';
      b.onclick = function(){
        if (!sel.value) { window.alert('会員を選択してください。'); return; }
        api({ action:'line_linkUnlinked', resId:u.resId, customerId:sel.value }).then(function(res){
          if (res && res.success) { window.alert('紐付けました。お客様のマイ予約に反映されます。'); loadUnlinked(); }
          else { showError('紐付けに失敗しました（' + ((res&&res.code)||'不明') + '）。'); }

      // チケット補充（枚数1〜／単価はトレーナー入力・必須／有効期限は任意＝空なら今日＋⌈枚数/2⌉ヶ月・購入パックごと独立）

      var pinp = document.createElement('input'); pinp.type = 'number'; pinp.min = '0'; pinp.inputMode = 'numeric'; pinp.placeholder = '単価(円)'; pinp.style.cssText = 'padding:9px;width:104px;';

  // 予約の代行（トレーナーが顧客の代わりに新規予約）— まずトレーナー選択（#4：担当を選べる。鈴木が沖担当で代行等）→週グリッド
  function startProxyReservation(customerId, name, defaultTrainerId){

  }
  on('tadminReload', function(){ loadTrainerReservations(); });
  function trainerCancel(r){

  function startTrainerChange(r){
    state.changeMode = true;

  // 残数(home)のHTML（会員ホーム・トレーナーの顧客詳細で共用）。detailed=trueで月額の「今月のご予約」明細も出す。
  function homeInfoHtml(h, detailed){
    h = h || { type:null };
    // #3：チケット期限行。pack が2つ以上ならpack別内訳（3枚(12/31まで) ／ 5枚(3/31まで)）、1つ以下は単一期限。
    function ticketExpireLine(single){
      var ps = h.ticketPacks || [];
      if (ps.length > 1) return '<div class="home-row"><span class="k">チケット内訳</span><span class="v" style="font-size:13px;line-height:1.6;">'
        + ps.map(function(p){ return p.remaining + '枚（' + (p.expire || '期限なし') + 'まで）'; }).join('<br>') + '</span></div>';
      return single ? '<div class="home-row"><span class="k">' + (h.type === 'ticket' ? '有効期限' : 'チケット期限') + '</span><span class="v" style="font-size:14px;">' + single + '</span></div>' : '';
    }
    if (h.type && h.active === false) return '<p class="muted">現在ご予約いただけない契約状態です。店舗にお問い合わせください。</p>';
    if (h.type === 'both') {
      var mLeft = (h.monthlyRemaining !== null && h.monthlyRemaining !== undefined) ? h.monthlyRemaining : Math.max(0, h.quota - h.thisMonth);
      return '<div class="home-row"><span class="k">今月の残り</span><span class="v"><b>' + mLeft + '</b> 回</span></div>' +
        '<div class="home-row"><span class="k">チケット残り</span><span class="v"><b>' + h.ticketRemaining + '</b> 枚</span></div>' +
        ticketExpireLine(h.ticketExpire);
    }
    if (h.type === 'ticket') return '<div class="home-row"><span class="k">チケット残り</span><span class="v"><b>' + h.remaining + '</b> 回</span></div>' +
      ticketExpireLine(h.expire);
    if (h.type === 'monthly') {
      var left = (h.remaining !== null) ? h.remaining : Math.max(0, h.quota - h.thisMonth);
      var s = '<div class="home-row"><span class="k">今月の残り</span><span class="v"><b>' + left + '</b> 回</span></div>';
      if (detailed) s += '<div class="home-row"><span class="k">今月のご予約</span><span class="v" style="font-size:14px;">' + (h.thisMonth + ' 回 ／ 月' + h.quota + '回' + (h.carryover ? '＋繰越' + h.carryover + '回' : '')) + '</span></div>';
      return s;
    }
    return detailed ? '<p class="muted" style="margin-top:12px;">ご予約はこちらから承ります。</p>' : '<p class="muted">残数情報がありません。</p>';
  }
  function renderHome(res){

      state.hasNormalRoute = !!res.hasNormalRoute;              // 月額/通常チケットも残っている＝消化先を選べる
      state.pairRemaining = Number(res.pairRemaining || 0);
      state.pairPackMax = Number(res.pairPackMax || 0);         // 単一チケットの最大残（2名来店の可否目安）

        ? '<div class="home-row"><span class="k">振替可能</span><span class="v"><b>' + res.transferCredits.available + '</b> 回' + (res.transferCredits.nextExpireLabel ? '（' + res.transferCredits.nextExpireLabel + 'まで）' : '') + '</span></div>' : '';

          box.appendChild(hd);

  function startChange(r){
    var note = r.freeCancel ? '' : '\n本日以降のため、変更時に1回分の消化となります。';
    if (!window.confirm(r.dateLabel + ' の予約時間を変更します。\n次の画面で新しい時間を選んでください。' + note)) return;
    state.changeMode = true;
    state.changeReservationId = r.reservationId;
    state.excludeStartISO = r.startISO || '';   // 自分の旧予定を空き枠から除外（問題2）
    state.trainerId = r.trainerId;
    state.trainerName = r.trainerName;
    state.weekOffset = 0;
    loadSlots();                 // 同トレーナーの週グリッドへ（新しい時間を選ぶ）
  }

  function cancelReservation(r){
    var msg;
    if (r.freeCancel) {
      msg = r.dateLabel + ' のご予約をキャンセルします。よろしいですか？\n（前日17時まで無料です）';
    } else if (r.transfer) {
      // 振替セッションの当日キャンセルは、確認の時点で「再申込不可」を明示する。
      msg = r.dateLabel + ' の振替セッションをキャンセルします。\n本日以降のため1回分の消化となり、振替の再申し込みはできません。\nよろしいですか？';
    } else {
      msg = r.dateLabel + ' のご予約をキャンセルします。\n本日以降のため、1回分の消化となります。よろしいですか？';
    }
    if (!window.confirm(msg)) return;
    show('s-loading'); dbg('キャンセル処理中…');
    api({ action:'line_cancelReservation', reservationId: r.reservationId }).then(function(res){
      if (!res || !res.success) { showError('キャンセルに失敗しました（コード：' + ((res && res.code) || '不明') + '）。'); return; }
      if (res.penalty && !r.transfer) {
        // 当日キャンセル＝1回消化。振替セッション（+5,500円）を案内。
        // ★振替セッション自身のキャンセルでは案内しない（振替の振替＝再振替を防ぐ。バックエンドでも同ガード）。
        if (window.confirm('当日キャンセルのため1回分を消化しました。\n\n振替セッション（追加5,500円）をお申し込みになりますか？\n（次の画面で日時を選べます）')) {
          startTransfer(r);
          return;
        }
      }
      loadMyReservations();
    }).catch(function(e){ showError('通信に失敗しました：' + e); });
  }

  function startTransfer(r){
    state.transferMode = true;
    state.changeMode = false; state.changeReservationId = '';
    state.excludeStartISO = r.startISO || '';   // キャンセルした元予定を振替枠の空き判定から除外（問題2）
    state.trainerId = r.trainerId;
    state.trainerName = r.trainerName;
    state.weekOffset = 0;

  function loadSlots(){
    show('s-loading'); dbg('空き枠を取得中…');
    api({ action:'line_getTrainerSlots', trainerId: state.trainerId, excludeStartISO: state.excludeStartISO || '' }).then(function(res){
      if (!res.success) { showError('空き枠の取得に失敗しました。'); return; }
      state.slots = res.slots || [];
      renderWeek();
      show('s-week');
    }).catch(function(e){ showError('通信に失敗しました：'+e); });
  }

  function fmtDate(d){
    var y=d.getFullYear(), m=('0'+(d.getMonth()+1)).slice(-2), day=('0'+d.getDate()).slice(-2);
    return y+'/'+m+'/'+day;
  }

  function renderWeek(){
    var base = new Date(); base.setHours(0,0,0,0);
    base.setDate(base.getDate() + state.weekOffset*7);
    var days = [];
    for (var i=0;i<7;i++){ var d=new Date(base); d.setDate(base.getDate()+i); days.push(d); }
    var dowJa=['日','月','火','水','木','金','土'];
    document.getElementById('weekLabel').textContent =
      (days[0].getMonth()+1)+'/'+days[0].getDate()+' 〜 '+(days[6].getMonth()+1)+'/'+days[6].getDate();

    var index = {};
    state.slots.forEach(function(s){
      var h = parseInt((s.startTime||'0:0').split(':')[0], 10);
      var key = s.date + '#' + h;
      (index[key] = index[key] || []).push(s);   // 同じ時間帯に複数枠（15分刻み）を保持
    });
    Object.keys(index).forEach(function(k){ index[k].sort(function(a,b){ return a.startISO < b.startISO ? -1 : 1; }); });

    var html = '<table class="grid"><thead><tr><th></th>';
    days.forEach(function(d){ html += '<th>'+ (d.getMonth()+1)+'/'+d.getDate()+'<br>'+dowJa[d.getDay()] +'</th>'; });
    html += '</tr></thead><tbody>';
    for (var h=BUSINESS_START; h<BUSINESS_END; h++){
      html += '<tr><td class="h">'+h+'</td>';
      days.forEach(function(d){
        var key = fmtDate(d) + '#' + h;
        html += index[key] ? '<td class="cell-open" data-key="'+key+'">○</td>' : '<td class="cell-none">·</td>';
      });
      html += '</tr>';
    }
    html += '</tbody></table>';
    var wrap = document.getElementById('gridWrap'); wrap.innerHTML = html;
    state._index = index;
    Array.prototype.forEach.call(wrap.querySelectorAll('.cell-open'), function(td){
      td.onclick = function(){
        var slots = state._index[td.getAttribute('data-key')];
        if (!slots || !slots.length) return;
        if (slots.length === 1) { openConfirm(slots[0]); return; }   // 毎時（9月〜）＝1枠→即確認
        chooseStartTime(slots);   // 15分刻み（8月）＝複数枠→開始時刻を選ばせる
      };
    });
  }

  on('prevWeek', function(){ if(state.weekOffset>0){ state.weekOffset--; renderWeek(); } });
  on('nextWeek', function(){ if(state.weekOffset<3){ state.weekOffset++; renderWeek(); } });
  on('backToTrainer', function(){ state.changeMode=false; state.changeReservationId=''; state.transferMode=false; state.proxyMode=false; if (state._fromTrainerAdmin){ state._fromTrainerAdmin=false; loadTrainerReservations(); return; } show('s-trainer'); });

  // 15分刻みの日：同じ時間帯に複数の開始時刻がある→選ばせる
  function chooseStartTime(slots){
    var old = document.getElementById('startPicker'); if (old) old.remove();
    var wrap = document.getElementById('gridWrap');
    var box = document.createElement('div'); box.id = 'startPicker';
    box.style.cssText = 'margin:12px 0;padding:12px;background:#fff;border:1px solid var(--acc);border-radius:8px;';
    box.innerHTML = '<div style="margin-bottom:8px;font-weight:600;">開始時刻をお選びください</div>';
    slots.forEach(function(s){
      var b = document.createElement('button'); b.className = 'btn btn-outline';
      b.style.cssText = 'margin:4px;display:inline-block;width:auto;padding:8px 14px;';
      b.textContent = s.startTime + '〜' + s.endTime;
      b.onclick = function(){ box.remove(); openConfirm(s); };
      box.appendChild(b);
    });
    wrap.parentNode.insertBefore(box, wrap);
    if (box.scrollIntoView) box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function openConfirm(slot){
    state.selected = slot;
    state.useTransfer = false; state.repeatCount = 1;
    // 消化先の既定：通常経路（月額・通常チケット）が残っていればそちら。ペアチケットしか無い会員だけペア既定。
    //   ※ホームの残数は「本日基準」。既定値のまま送るとサーバの対象日判定を上書きして
    //     「本日は通常が残っているが予約日には失効」等で不要に予約不能になるため、
    //     会員が明示的に選んだときだけ packKind を送る（packKindExplicit）。
    state.packKind = 'normal';
    state.packKindExplicit = false;
    // 選択肢は「予約対象日時」基準でサーバから取り直す（ホームの当日基準の残数で未来予約を縛らない）。
    //   応答が返るまで選択UIは出さず、最後のリクエストの応答だけを採用する（顧客/日時の切替競合を防ぐ）。
    state.optReady = false; state.optError = ''; state.pairRemaining = 0; state.pairPackMax = 0; state.hasNormalRoute = true;
    setConfirmEnabled();   // 取得できるまで確定させない（既定1名のまま送られるのを防ぐ）
    var _seq = (state._optSeq = (state._optSeq || 0) + 1);
    var _optReq = { action:'line_getBookingOptions', startISO: slot.startISO };
    if (state.proxyMode) _optReq.customerId = state.proxyCustomerId;
    api(_optReq).then(function(r){
      if (_seq !== state._optSeq) return;   // 古い応答は捨てる
      if (r && r.success) {
        state.pairRemaining = Number(r.pairRemaining || 0);
        state.pairPackMax = Number(r.pairPackMax || 0);
        state.hasNormalRoute = !!r.hasNormalRoute;
        state.pairExpire = String(r.pairExpire || '');   // 対象日に有効なpackの期限（当日基準の期限を出さない）
        state.isPair = state.pairRemaining > 0;
        state.packKind = (state.isPair && !state.hasNormalRoute) ? 'pair' : 'normal';
        state.attendeeCount = (!state.proxyMode && state.packKind === 'pair' && state.pairPackMax >= 2) ? 2 : 1;
        state.optReady = true; state.optError = '';
      } else {
        // 取得できないまま人数を推測して予約しない（fail-closed）
        state.optError = (r && r.message) || 'ご利用チケットを確認できませんでした。';
      }
      buildConfirmOptions(); setConfirmEnabled();
    }).catch(function(){
      if (_seq !== state._optSeq) return;
      state.optError = '通信に失敗しました。'; buildConfirmOptions(); setConfirmEnabled();
    });
    // 代行は既定1名（月額会員の通常予約が大半なので、2名はトレーナーの明示選択に限る）
    state.attendeeCount = state.proxyMode ? 1 : ((state.packKind === 'pair' && state.pairPackMax >= 2) ? 2 : 1);   // 毎回リセット
    document.getElementById('cfTrainer').textContent = state.trainerName;
    var dt = new Date(slot.startISO);
    var dowJa=['日','月','火','水','木','金','土'];
    document.getElementById('cfDatetime').textContent =
      (dt.getMonth()+1)+'月'+dt.getDate()+'日('+dowJa[dt.getDay()]+') '+slot.startTime+'〜'+slot.endTime;
    buildConfirmOptions();
    document.getElementById('confirmErr').hidden = true;
    show('s-confirm');
  }
  // 選択肢が対象日基準で確定するまで／確定できなかった場合は「予約を確定する」を押させない
  function setConfirmEnabled(){
    var b = document.getElementById('confirmBtn'); if (!b) return;
    b.disabled = !(state.optReady && !state.optError);
  }
  // #9 振替券の選択・#6 繰り返し を確定画面に動的描画（通常の会員予約フローのみ）
  function buildConfirmOptions(){
    var host = document.getElementById('cfOptions');
    if (!host) { host = document.createElement('div'); host.id='cfOptions'; host.style.cssText='margin-top:10px;'; var dtEl=document.getElementById('cfDatetime'); dtEl.parentNode.appendChild(host); }
    host.innerHTML='';
    // 選択肢の取得中/失敗時は何も描かない（当日基準の古い値や既定値で予約させない）
    if (state.optError) {
      host.innerHTML = '<div class="err">' + state.optError + '</div>';
      var rb = document.createElement('button'); rb.className='btn btn-outline'; rb.textContent='再試行';
      rb.onclick = function(){ openConfirm(state.selected); };
      host.appendChild(rb); return;
    }
    if (!state.optReady) { host.innerHTML = '<span class="muted">ご利用チケットを確認中…</span>'; return; }
    // 代行：ペアチケットを持つ顧客は来店人数を必ず指定させる（1名固定で作ると2名来店が過少計上になる）。
    //   消化先(packKind)は送らずサーバの対象日判定に委ねる＝2名なら自動でペア、1名は通常経路優先。
    if (state.proxyMode && state.pairRemaining > 0){
      var px=document.createElement('div'); px.style.cssText='margin-bottom:8px;padding:8px 10px;background:#f0f4fa;border-radius:8px;';
      var _pcan2 = state.pairPackMax >= 2;
      px.innerHTML='<div style="font-weight:600;margin-bottom:4px;">ご来店人数（ペアチケット保有）</div>'
        +'<label style="display:inline-block;margin-right:14px;"><input type="radio" name="cfAtt" value="1"'+(state.attendeeCount===2?'':' checked')+'> 1名</label>'
        +(_pcan2 ? '<label style="display:inline-block;"><input type="radio" name="cfAtt" value="2"'+(state.attendeeCount===2?' checked':'')+'> 2名（ペアで消化）</label>' : '<span class="muted" style="font-size:12px;">残りが1人数回のため1名のみ</span>');
      px.addEventListener('change', function(){ var c=document.querySelector('input[name=cfAtt]:checked'); state.attendeeCount = (c && c.value==='2') ? 2 : 1; });
      host.appendChild(px);
    }
    var isPlain = !state.proxyMode && !state.changeMode && !state.transferMode;
    if (!isPlain) return;
    // ペアチケットと通常経路（月額/通常チケット）を両方持つ会員は、どちらを使うか選ぶ。
    //   選ばせないと常に通常が先に減り、ペアチケットが期限切れになりうるため。
    if (state.isPair && state.hasNormalRoute){
      var pk=document.createElement('div'); pk.style.cssText='margin-bottom:8px;padding:8px 10px;background:#f0f4fa;border-radius:8px;';
      pk.innerHTML='<div style="font-weight:600;margin-bottom:4px;">使用するチケット</div>'
        +'<label style="display:block;margin:3px 0;"><input type="radio" name="cfKind" value="normal"'+(state.packKind==='pair'?'':' checked')+'> 通常（月額・通常チケット）</label>'
        +'<label style="display:block;margin:3px 0;"><input type="radio" name="cfKind" value="pair"'+(state.packKind==='pair'?' checked':'')+'> ペアチケット <span class="muted" style="font-size:12px;">残'+state.pairRemaining+'人数回'+(state.pairExpire?'（'+state.pairExpire+'まで）':'')+'</span></label>';
      pk.addEventListener('change', function(){
        var c=document.querySelector('input[name=cfKind]:checked');
        state.packKind = (c && c.value==='pair') ? 'pair' : 'normal';
        state.packKindExplicit = true;   // 会員が選んだ＝サーバの自動判定より優先させる
        state.attendeeCount = (state.packKind==='pair' && state.pairPackMax>=2) ? 2 : 1;
        buildConfirmOptions();   // 人数選択・繰り返しの出し分けを作り直す
      });
      host.appendChild(pk);
    }
    // ペアチケットを使うときだけ来店人数（2名＝2消化／1名＝1消化＋差額）を選ぶ
    if (state.packKind === 'pair'){
      var pr=document.createElement('div'); pr.style.cssText='margin-bottom:8px;padding:8px 10px;background:#f0f4fa;border-radius:8px;';
      var _can2 = state.pairPackMax >= 2;   // 同一チケットに2人数回の空きが必要（1回ずつ別チケットには分割しない）
      pr.innerHTML='<div style="font-weight:600;margin-bottom:4px;">ご来店人数</div>'
        +(_can2 ? '<label style="display:inline-block;margin-right:14px;"><input type="radio" name="cfAtt" value="2"'+(state.attendeeCount===2?' checked':'')+'> 2名（お二人）</label>' : '')
        +'<label style="display:inline-block;"><input type="radio" name="cfAtt" value="1"'+(state.attendeeCount===2?'':' checked')+'> 1名（差額をご請求）</label>'
        +(_can2 ? '' : '<div class="muted" style="font-size:12px;margin-top:4px;">残りが1人数回のため1名でのご利用となります。</div>');
      pr.addEventListener('change', function(){ var c=document.querySelector('input[name=cfAtt]:checked'); state.attendeeCount = (c && c.value==='2') ? 2 : 1; });
      host.appendChild(pr);
    }
    // #9：有効な振替券があるときだけ ①通常/②振替 を選べる（既定=通常）
    if (state.transferCredits && state.transferCredits.available > 0){
      var tc=document.createElement('div'); tc.style.cssText='margin-bottom:8px;padding:8px 10px;background:#faf7f0;border-radius:8px;';
      tc.innerHTML='<div style="font-weight:600;margin-bottom:4px;">お支払い方法</div>'
        +'<label style="display:block;margin:3px 0;"><input type="radio" name="cfPay" value="normal" checked> 通常予約（残数を1回消化）</label>'
        +'<label style="display:block;margin:3px 0;"><input type="radio" name="cfPay" value="transfer"> 振替で予約（残数を使わない・5,500円）<span class="muted" style="font-size:12px;">振替可能 '+state.transferCredits.available+'回'+(state.transferCredits.nextExpireLabel?'（'+state.transferCredits.nextExpireLabel+'まで）':'')+'</span></label>';
      tc.addEventListener('change', function(){ var c=document.querySelector('input[name=cfPay]:checked'); state.useTransfer = !!(c && c.value==='transfer'); var rs=document.getElementById('cfRepeatWrap'); if (rs) rs.style.display = state.useTransfer ? 'none' : 'flex'; if (state.useTransfer) state.repeatCount=1; });
      host.appendChild(tc);
    }
    // #6：繰り返し（振替選択時は非表示・ペアチケット利用時は人数を回ごとに選ぶ必要があるため非表示。残数不足の回は自動スキップ）
    if (state.packKind === 'pair') return;
    var rc=document.createElement('div'); rc.id='cfRepeatWrap'; rc.style.cssText='display:flex;gap:8px;align-items:center;';
    var lbl=document.createElement('span'); lbl.textContent='繰り返し'; lbl.className='muted';
    var sel=document.createElement('select'); sel.style.cssText='padding:8px;';
    sel.innerHTML='<option value="1">なし（1回）</option>'+[2,3,4,5,6,7,8].map(function(n){return '<option value="'+n+'">毎週'+n+'回</option>';}).join('');
    sel.addEventListener('change', function(){ state.repeatCount=Number(sel.value)||1; });
    rc.appendChild(lbl); rc.appendChild(sel); host.appendChild(rc);
  }
  on('confirmCancel', function(){ show('s-week'); });
  on('confirmBtn', function(){
    if (!state.optReady || state.optError) return;   // 二重防御：選択肢が確定していない状態では送らない
    var btn = this; var errEl = document.getElementById('confirmErr'); errEl.hidden=true;
    btn.disabled = true; btn.textContent='処理中…';
    var _isTransfer = state.transferMode || state.useTransfer;   // #9：既存の振替フロー or 確定画面で②振替を選択
    var _isRecurring = !state.proxyMode && !state.changeMode && !_isTransfer && Number(state.repeatCount) > 1;   // #6
    var req = state.proxyMode
      // 代行は来店人数のみ送り、消化先(packKind)はサーバの対象日判定に委ねる（2名なら自動でペア）
      ? { action:'line_makeReservationLineProxy', customerId: state.proxyCustomerId, trainerId: state.trainerId, startISO: state.selected.startISO, attendeeCount: state.attendeeCount }
      : _isTransfer
        ? { action:'line_makeTransferReservation', trainerId: state.trainerId, startISO: state.selected.startISO }
        : state.changeMode
          ? { action:'line_changeReservation', reservationId: state.changeReservationId, newStartISO: state.selected.startISO }
          : _isRecurring
            ? { action:'line_makeRecurringReservation', trainerId: state.trainerId, startISO: state.selected.startISO, repeatCount: state.repeatCount }
            // packKind は会員が明示的に選んだときだけ送る（未選択なら対象日基準のサーバ自動判定に任せる）
            : { action:'line_makeReservationLine', trainerId: state.trainerId, startISO: state.selected.startISO, attendeeCount: state.attendeeCount, packKind: (state.packKindExplicit ? state.packKind : '') };
    api(req)
      .then(function(res){
        btn.disabled=false; btn.textContent='予約を確定する';
        if (res.success) {
          var s = state.selected;
          if (_isRecurring) {   // #6：作成件数・スキップ件数を表示
            document.getElementById('doneDetail').textContent = state.trainerName + '／' + s.date + ' ' + s.startTime + '〜 を毎週 ' + res.createdCount + ' 件予約しました' + (res.skippedCount ? '（' + res.skippedCount + ' 件は空き/残数の都合でスキップ）' : '');
          } else {
            document.getElementById('doneDetail').textContent = (state.proxyMode ? state.proxyCustomerName + ' 様／' : '') + state.trainerName + '／' + s.date + ' ' + s.startTime + '〜' + s.endTime + (_isTransfer ? '（振替・5,500円）' : state.changeMode ? '（変更）' : state.proxyMode ? '（代行予約）' : '');
          }
          state.changeMode = false; state.changeReservationId = ''; state.transferMode = false; state.proxyMode = false; state.proxyCustomerId = ''; state.proxyCustomerName = ''; state.useTransfer = false; state.repeatCount = 1;
          show('s-done');
        } else {
          errEl.textContent = res.message || 'この時間は予約できませんでした。別の枠をお選びください。';
          errEl.hidden = false;
        }
      }).catch(function(e){ btn.disabled=false; btn.textContent='予約を確定する'; errEl.textContent='通信に失敗しました：'+e; errEl.hidden=false; });
  });

  on('doneClose', function(){ if (state._fromTrainerAdmin){ state._fromTrainerAdmin=false; loadTrainerReservations(); return; } loadHome(); });   // アプリを閉じず残数更新してホームへ（連続予約対応）

  boot();
</script>
</body>
</html>
