name: Worker の鍵 ANTHROPIC_API_KEY を登録・削除する（設計39）

# 録音の文字起こしの AI 下書き（設計39・I76）が使う Anthropic API の鍵を、Cloudflare Worker の Secret に入れる／消す。
#   ★鍵の値はオーナーが GitHub の Secrets（環境 production-edge）に ANTHROPIC_API_KEY として登録する。ここには書かない
#   ★鍵を入れても、wrangler.toml の KARTE_AI_DRAFT が "off" の間は何も外へ送らない（I76）
#   ★止めたいときは action=delete で消す（Worker は NO_KEY で 503 を返し、画面のボタンが消える）
#   ★wrangler deploy（worker-deploy.yml）は Secret を消さない。登録は1回でよい
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'put（登録・入れ替え）／delete（削除）'
        required: true
        default: put
        type: choice
        options: [put, delete]

concurrency:
  group: worker-secret-anthropic
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  secret:
    runs-on: ubuntu-latest
    environment: production-edge      # main に限った環境（決定0170）。鍵はこの環境の Secrets にだけ置く
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: wrangler を入れる
        run: npm install --no-fund --no-audit wrangler@4
      - name: 鍵を登録する
        if: ${{ inputs.action == 'put' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then echo "::error::環境 production-edge に ANTHROPIC_API_KEY がありません"; exit 1; fi
          # ★値は標準入力で渡す（コマンドの引数・ログに出さない）
          printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY >/dev/null
          echo "登録しました（値は表示しません）"
      - name: 鍵を消す
        if: ${{ inputs.action == 'delete' }}
        run: |
          set -euo pipefail
          npx wrangler secret delete ANTHROPIC_API_KEY --force >/dev/null || { echo "::error::削除できませんでした"; exit 1; }
          echo "削除しました"
