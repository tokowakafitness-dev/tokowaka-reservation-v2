# TOKOWAKA 予約・契約 API
#   デプロイは GitHub Actions が行う（ローカルの wrangler login はしない方針・memory.md 参照）。
name = "tokowaka-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# LINEのチャネルID。ID Tokenの aud を照合するのに使う（公開情報・機密ではない）
[vars]
LINE_CHANNEL_ID = "2010827953"

# ---- 残数をD1の行から作るか（段階3-b・2026-10-09）-----------------------------
#   "off"（既定）  いまのまま。写し（member_home）を読む。比べもしない
#   "shadow"       写しを読んだあと、D1からも読んで**比べて記録する**。
#                  ★顧客に出すのは写しのまま。応答のあとに走る（ctx.waitUntil）
#   "on"           ★手順4。D1の値を顧客に出す（オーナー承認が要る）
#
#   ★厳密に "shadow" のときだけ比べる。書き忘れ・打ち間違いは off 側に倒れる。
#   設計：ops/design/12-shadow-compare.md
LB_D1_REMAIN_MODE = "shadow"

# ---- ★読み取りの肩代わりを全部止めるための一行（2026-10-03）-----------------
#   EDGE_READS = "off"  … 画面が呼ぶ窓口（c_ で始まるもの）をすべてGASへ戻す。
#                         画面に一切触れずに全員が元の経路に戻る。1分ほどで効く。
#   書かない（既定）    … 通常どおりWorkerが答える。
#
#   ★なぜ画面側の切り替え（EDGE_ON）だけでは足りないか
#     画面は端末のキャッシュに載っており、push しても即座には届かない。
#     さらに 2026-09-29、既定を false にしたのに鍵の読み方が対で直っておらず
#     「止めたつもりで止まっていなかった」事故を起こした。
#     止める手段は、画面を経由しないここに置く。
# EDGE_READS = "off"

# ---- ① calendar_events から空き枠を計算する経路（2026-10-03・段階導入）-------------
#   既定（この行を書かない）… body.useCalendar === true のときだけ①を使う。
#                              ＝オーナーの端末だけで試す段階。
#   SLOTS_FROM_CALENDAR = "on"  … 全員①を使う（数日見てから、ここを足す）
#   SLOTS_FROM_CALENDAR = "off" … 誰も①を使わない。**body より強い＝止めるための一行。**
#                                 変だと思ったらこれを足して deploy すれば②（写し）に戻る。
#   ★"off" を書いたままだと body.useCalendar も効かない。試す段階では**書かない**。
# SLOTS_FROM_CALENDAR = "on"
#
#   CAL_RULE_VERSION … 分類規則の版。**GAS の LB_CALSYNC_RULE_VERSION と同じ値にする。**
#                      既定1。GAS側を上げたらここも上げる。
#                      揃っていないと①は使われず、黙って②へ落ちる
#                      （応答の fallbackReason が 'rule' になるので気づける）。
# CAL_RULE_VERSION = "1"
#
#   CAL_FLAG_1F … 現在の1Fフラグ。**GAS の LB_1F_TRAINER_BLOCK と同じ値にする。**
#                 既定 off（GASの既定と同じ）。GAS側を on にしたらここも on にする。
#                 揃っていないと fallbackReason が 'flag' になって①が使われない。
# CAL_FLAG_1F = "off"
#
#   CAL_B1_CALENDAR_ID … B1（部屋の容量）のカレンダーID。任意。
#                        書くと「その世代にB1が入っているか」を要求ごとに確かめる。
#                        書かなくても /calsync の検査が「ちょうど1つ」を強制しているので
#                        公開された世代には必ず入っている（二重の確認）。
# CAL_B1_CALENDAR_ID = ""

# 契約・顧客・予約。正確さが要るものを置く
[[d1_databases]]
binding = "DB"
database_name = "tokowaka-apac"
database_id = "PASTE_D1_ID_HERE"    # setup ワークフローの出力を貼る

# トレーナー名簿・空き枠・残数の写し。みんなが同じものを読むものを置く
[[kv_namespaces]]
binding = "KV"
id = "PASTE_KV_ID_HERE"             # setup ワークフローの出力を貼る
